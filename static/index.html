<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나비 길드 대시보드</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ═══════════════════════════════════════════
       나비 길드 — 디자인 시스템
       원칙: 장식 대신 타이포와 여백. 색은 파랑 하나 + 경고 빨강 하나.
       ═══════════════════════════════════════════ */
    :root {
      --bg:        #F7F8FA;
      --surface:   #FFFFFF;
      --fill:      #F2F4F6;
      --fill-2:    #F9FAFB;
      --line:      #E9ECEF;
      --text:      #191F28;
      --ink-2:     #4E5968;
      --muted:     #8B95A1;
      --accent:    #3182F6;
      --accent-weak: #E8F1FD;
      --danger:    #F04452;
      --danger-weak: #FDECEE;
      --up:        #00A661;
      --up-weak:   #E4F7EF;
      --radius:    18px;
      --radius-sm: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #15171A;
        --surface:   #1B1E22;
        --fill:      #24282E;
        --fill-2:    #212429;
        --line:      #2E333A;
        --text:      #EDEFF2;
        --ink-2:     #B0B8C1;
        --muted:     #7B848F;
        --accent:    #4D93F8;
        --accent-weak: #1B2C44;
        --danger:    #FF6B75;
        --danger-weak: #3A2226;
        --up:        #2FCB86;
        --up-weak:   #16342A;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      letter-spacing: -0.02em;
    }

    .wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px 80px;
      width: 100%;
    }

    /* ── 헤더 ───────────────────────────── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      padding: 40px 0 28px;
    }
    .header-left h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.3;
    }
    .header-left .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 6px;
      font-weight: 500;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .updated-at {
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .admin-link-btn {
      display: inline-flex;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--fill);
      border: 0;
      color: var(--ink-2);
      text-decoration: none;
      transition: background 0.15s;
    }
    .admin-link-btn:hover { background: var(--line); }

    /* 사용 안 함 (마크업에서 제거됨) */
    .live-badge, .live-dot { display: none; }

    /* ── 통계 3종 ───────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 22px 24px;
    }
    .stat-label {
      font-size: 0.85rem;
      color: var(--ink-2);
      font-weight: 600;
      margin-bottom: 10px;
    }
    .stat-value {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
    .stat-value span {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-left: 3px;
      letter-spacing: -0.02em;
    }

    /* ── 카드 / 섹션 ────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
      color: var(--text);
    }
    .chart-wrap { position: relative; height: 260px; }
    .stat-trend-wrap { position: relative; height: 220px; }

    /* ── 브리핑 ─────────────────────────── */
    .brief-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--accent-weak);
      border-radius: var(--radius);
      padding: 18px 22px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.55;
    }
    .brief-banner .brief-icon {
      font-size: 1rem;
      font-weight: 800;
      color: var(--accent);
      flex-shrink: 0;
    }
    .brief-icon { font-style: normal; }
    .brief-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
    .brief-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
    .brief-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px 22px;
    }
    .brief-card-label {
      font-size: 0.82rem;
      color: var(--ink-2);
      font-weight: 600;
      margin-bottom: 9px;
    }
    .brief-card-value {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
    }
    .brief-group-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin: 20px 0 10px;
    }
    .brief-change { font-size: 0.85rem; font-weight: 700; margin-top: 6px; }
    .brief-change.up, .brief-pct.up { color: var(--up); }
    .brief-change.down, .brief-pct.down { color: var(--danger); }
    .brief-pct { font-size: 0.85rem; font-weight: 700; }
    .brief-bar-wrap {
      height: 6px;
      background: var(--fill);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }
    .brief-bar { height: 100%; background: var(--accent); border-radius: 999px; }
    .brief-record, .brief-streak {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 7px;
      font-weight: 500;
    }

    /* ── TOP 5 ──────────────────────────── */
    .top5-wrap { margin-top: 2px; }
    .top5-champion {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 22px 24px;
      margin-bottom: 8px;
      background: var(--accent-weak);
      border-radius: var(--radius);
    }
    .top5-crown {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent);
      width: 24px;
      text-align: center;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .top5-champion-meta { flex: 1; min-width: 0; }
    .top5-champion-label {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 5px;
      letter-spacing: 0;
    }
    .top5-champion-name {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.25;
    }
    .top5-champion-job {
      font-size: 0.82rem;
      color: var(--ink-2);
      margin-top: 3px;
      font-weight: 500;
    }
    .top5-champion-score {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    /* 단위('점')는 숫자와 같은 크기·굵기로 맞춘다 (색만 한 단계 죽여 위계 유지) */
    .top5-champion-score-unit {
      font-size: 1em;
      font-weight: 800;
      color: var(--ink-2);
      margin-left: 4px;
      letter-spacing: -0.03em;
    }
    .top5-list { background: var(--surface); border-radius: var(--radius); padding: 4px 24px; }
    .top5-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 15px 0;
    }
    .top5-row + .top5-row { border-top: 1px solid var(--line); }
    .top5-medal {
      width: 24px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .top5-row.rank-2 .top5-medal, .top5-row.rank-3 .top5-medal { color: var(--accent); }
    .top5-meta { flex: 1; min-width: 0; }
    .top5-name { font-size: 1rem; font-weight: 700; letter-spacing: -0.03em; }
    .top5-job { font-size: 0.8rem; color: var(--muted); margin-top: 2px; font-weight: 500; }
    .top5-score {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .top5-score-unit {
      font-size: 1em;
      font-weight: 800;
      color: var(--muted);
      margin-left: 4px;
      letter-spacing: -0.03em;
    }

    /* ── 통계 분석 ──────────────────────── */
    .analysis-block { margin-bottom: 18px; }
    .analysis-label {
      font-size: 0.82rem;
      color: var(--ink-2);
      font-weight: 600;
      margin-bottom: 7px;
    }
    .analysis-value {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
    }
    .analysis-desc {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.6;
      font-weight: 500;
    }
    .analysis-divider {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 22px 0;
    }
    /* 항목은 Q1/Q2/Q3 3개 — 칸 수를 맞춰 행을 꽉 채운다 */
    .quartile-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .quartile-item {
      background: var(--fill-2);
      border-radius: var(--radius-sm);
      padding: 15px 16px;
    }
    .quartile-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .quartile-val {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    /* ── 리더보드 ───────────────────────── */
    .leaderboard-row-public {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }
    .lb-list { margin-top: -4px; }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 0;
    }
    .lb-row + .lb-row { border-top: 1px solid var(--line); }
    .lb-medal {
      width: 22px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .lb-row.rank-1 .lb-medal,
    .lb-row.rank-2 .lb-medal,
    .lb-row.rank-3 .lb-medal { color: var(--accent); }
    .lb-meta { flex: 1; min-width: 0; }
    .lb-name {
      font-size: 0.94rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lb-job { font-size: 0.76rem; color: var(--muted); margin-top: 2px; font-weight: 500; }
    .lb-value {
      font-size: 0.94rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }
    .lb-value-sub {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2px;
    }
    .lb-value.fine { color: var(--danger); }
    .lb-value.rise { color: var(--up); }
    .lb-value.drop { color: var(--danger); }
    .lb-empty {
      font-size: 0.88rem;
      color: var(--muted);
      padding: 26px 0;
      text-align: center;
      font-weight: 500;
    }

    /* ── 분포 범례 ──────────────────────── */
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0 12px 8px 0;
      font-size: 0.78rem;
      font-weight: 500;
    }
    .legend-dot { width: 8px; height: 8px; border-radius: 3px; flex-shrink: 0; }
    .legend-name { color: var(--ink-2); }
    .legend-count { color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ── 전체 길드원 표 ─────────────────── */
    .full-table-section { margin-top: 12px; }
    .table-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .search-input {
      flex: 1;
      min-width: 200px;
      max-width: 320px;
      padding: 11px 15px;
      border-radius: var(--radius-sm);
      border: 0;
      background: var(--fill);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      letter-spacing: -0.02em;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
    .table-info { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }

    .full-table-wrap { overflow-x: auto; }
    .full-table { width: 100%; border-collapse: collapse; min-width: 520px; }
    .full-table th {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0 12px 12px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    .full-table td {
      text-align: center;
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    /* 표 정렬 관례: 모든 열 center, 닉네임 열만 left */
    .full-table th:nth-child(2), .full-table td:nth-child(2) { text-align: left; }
    .full-table tbody tr:last-child td { border-bottom: 0; }
    .full-table tbody tr:hover td { background: var(--fill-2); }
    .rank-job {
      font-size: 0.78rem;
      color: var(--ink-2);
      background: var(--fill);
      padding: 3px 9px;
      border-radius: 7px;
      white-space: nowrap;
      font-weight: 600;
    }
    .zero-score { color: var(--muted) !important; }

    .miss-badge, .carryover-badge, .spec-down-suspected-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-left: 7px;
      border: 0;
      font-family: inherit;
      vertical-align: middle;
    }
    .miss-badge { background: var(--danger-weak); color: var(--danger); }
    .carryover-badge { background: var(--fill); color: var(--ink-2); }
    .spec-down-suspected-tag { background: var(--fill); color: var(--muted); }
    .miss-badge:disabled, .carryover-badge:disabled { opacity: 1; cursor: default; }

    .history-btn, .leave-btn, .spec-down-btn {
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 13px;
      border-radius: 9px;
      border: 0;
      cursor: pointer;
      background: var(--fill);
      color: var(--ink-2);
      letter-spacing: -0.02em;
      transition: background 0.15s;
    }
    .history-btn:hover, .spec-down-btn:hover { background: var(--line); }
    .leave-btn { background: var(--danger-weak); color: var(--danger); }
    .fine-action-group { display: inline-flex; gap: 6px; flex-wrap: wrap; }

    /* ── 로딩 ───────────────────────────── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 40px 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 500;
    }
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.4s; }
      * { transition: none !important; }
    }

    /* ── 모달 ───────────────────────────── */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: var(--surface);
      border-radius: 22px;
      padding: 28px 26px 22px;
      width: 100%;
      max-width: 400px;
    }
    .modal-header {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      margin-bottom: 14px;
    }
    .modal-body {
      font-size: 0.92rem;
      color: var(--ink-2);
      line-height: 1.65;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .modal-info {
      background: var(--fill);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      font-size: 0.85rem;
      margin-top: 14px;
      color: var(--text);
    }
    .modal-actions { display: flex; gap: 8px; }
    .modal-btn {
      flex: 1;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 0;
      cursor: pointer;
      letter-spacing: -0.025em;
    }
    .modal-btn.primary { background: var(--accent); color: #fff; }
    .modal-btn.secondary { background: var(--fill); color: var(--ink-2); }
    .modal-btn:hover { filter: brightness(0.96); }

    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── 반응형 ─────────────────────────── */
    @media (max-width: 760px) {
      .brief-grid-4 { grid-template-columns: repeat(2, 1fr); }
      .quartile-row { grid-template-columns: repeat(2, 1fr); }
      .leaderboard-row-public { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .wrapper { padding: 0 14px 56px; }
      header { padding: 28px 0 20px; align-items: flex-start; flex-direction: column; }
      .header-left h1 { font-size: 1.45rem; }
      .stat-grid, .brief-grid-3 { grid-template-columns: 1fr; }
      .card, .stat-card, .brief-card { padding: 18px; }
      .top5-list { padding: 4px 18px; }
      .top5-champion { padding: 18px; gap: 12px; }
      .top5-champion-name { font-size: 1.2rem; }
      .top5-champion-score { font-size: 1.3rem; }
      .chart-wrap { height: 220px; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <h1>나비 길드</h1>
        <a href="/login" class="admin-link-btn">관리자</a>
      </div>
      <div class="subtitle">MAPLESTORY · 오로라 서버 · 지하수로 대시보드</div>
    </div>
    <div class="header-right">
      <div class="updated-at" id="updatedAt">불러오는 중...</div>
    </div>
  </header>

  <!-- STAT CARDS -->
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label" id="labelTotal">총 길드원</div>
      <div class="stat-value" id="statTotal">—<span>명</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label" id="labelActive">수로 참여자</div>
      <div class="stat-value" id="statActive">—<span>명</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label" id="labelScore">수로 총 점수</div>
      <div class="stat-value" id="statTotalScore">—</div>
    </div>
  </div>

  <!-- 브리핑 보드 -->
  <div id="briefingBoard" style="margin-bottom:32px;"></div>

  <!-- 주간 총점수 추이 -->
  <div class="card" style="margin-bottom:32px;">
    <div class="section-title">주간 길드 총점수 추이</div>

<script>
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const JOB_COLORS = [
  '#3182F6','#FFB020','#8B95A1','#00A661','#F04452',
  '#fb923c','#38bdf8','#e879f9','var(--yellow)','#34d399',
  '#60a5fa','#f472b6','#a3e635','#fb7185','#c084fc',
  '#22d3ee','#fbbf24','#86efac','#818cf8','#f9a8d4',
];

let allMembers = [];
let filteredMembers = [];
let jobChart = null;
let distChart = null;
let historyChart = null;
let statTrendChart = null;
let zeroScoreMembers = [];
let currentFineData = null;
let currentWeek = '';

async function fetchData() {
  const res = await fetch('/api/data');
  return res.json();
}

function fmt(n) {
  return Number(n).toLocaleString('ko-KR');
}

const JOB_NAME_MAP = {
  '아크메이지(불, 독)': '아크메이지(불, 독)',
  '아크메이지(불)': '아크메이지(불, 독)',
  '아크메이지(썬, 콜)': '아크메이지(썬, 콜)',
  '아크메이지(썬)': '아크메이지(썬, 콜)',
  '아크메이지 (불, 독)': '아크메이지(불, 독)',
  '아크메이지 (썬, 콜)': '아크메이지(썬, 콜)',
};

function normalizeJob(job) {
  return JOB_NAME_MAP[job] ?? job;
}

function normalizeMembers(members) {
  return members.map(m => ({ ...m, job: normalizeJob(m.job) }));
}

function renderStats(stats) {
  document.getElementById('statTotal').innerHTML = `${fmt(stats.total)}<span>명</span>`;
  document.getElementById('statActive').innerHTML = `${fmt(stats.active)}<span>명</span>`;
  document.getElementById('statTotalScore').textContent = fmt(stats.total_score);
  document.getElementById('updatedAt').textContent = `${stats.week_display} 기준`;
}

function calcAnalysis(members) {
  const scores = members.map(m => m.score).filter(s => s > 0).sort((a, b) => a - b);
  const n = scores.length;
  if (!n) return null;
  const mean = scores.reduce((a, b) => a + b, 0) / n;
  const stddev = Math.sqrt(scores.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
  const q = p => {
    const idx = p * (n - 1);
    const lo = Math.floor(idx), hi = Math.ceil(idx);
    return Math.round(scores[lo] + (scores[hi] - scores[lo]) * (idx - lo));
  };
  return { mean: Math.round(mean), stddev: Math.round(stddev), q1: q(0.25), q2: q(0.5), q3: q(0.75) };
}

function renderAnalysis(members) {
  const r = calcAnalysis(members);
  if (!r) { document.getElementById('statsAnalysisWrap').innerHTML = '<p style="color:var(--muted)">데이터 없음</p>'; return; }
  document.getElementById('statsAnalysisWrap').innerHTML = `
    <div class="analysis-block">
      <div class="analysis-label">평균 점수</div>
      <div class="analysis-value">${fmt(r.mean)}</div>
    </div>
    <hr class="analysis-divider">
    <div class="analysis-block">
      <div class="analysis-label">표준편차</div>
      <div class="analysis-value">${fmt(r.stddev)}</div>
    </div>
    <hr class="analysis-divider">
    <div class="analysis-block">
      <div class="analysis-label">사분위 구간</div>
      <div class="quartile-row">
        <div class="quartile-item">
          <div class="quartile-tag">Q1 · 하위 25%</div>
          <div class="quartile-val">${fmt(r.q1)}</div>
        </div>
        <div class="quartile-item">
          <div class="quartile-tag">Q2 · 중간값</div>
          <div class="quartile-val">${fmt(r.q2)}</div>
        </div>
        <div class="quartile-item">
          <div class="quartile-tag">Q3 · 상위 25%</div>
          <div class="quartile-val">${fmt(r.q3)}</div>
        </div>
      </div>
    </div>`;
}

function renderJobChart(dist) {
  const labels = dist.map(d => d.job);
  const data   = dist.map(d => d.count);
  const colors = dist.map((_, i) => JOB_COLORS[i % JOB_COLORS.length]);

  if (jobChart) jobChart.destroy();
  jobChart = new Chart(document.getElementById('jobChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '68%',
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed}명` }
      }},
      animation: { animateRotate: true, duration: 800 }
    }
  });

  const PAGE_SIZE = 10;
  let legendPage = 0;
  const totalPages = Math.ceil(dist.length / PAGE_SIZE);

  function renderLegendPage() {
    const start = legendPage * PAGE_SIZE;
    const items = dist.slice(start, start + PAGE_SIZE);
    document.getElementById('jobLegend').innerHTML = items.map((d, i) => `
      <div class="legend-item">
        <span class="legend-dot" style="background:${colors[start + i]}"></span>
        <span class="legend-name">${d.job}</span>
        <span class="legend-count">${d.count}명</span>
      </div>`).join('');
    document.getElementById('legendPage').textContent = `${legendPage + 1} / ${totalPages}`;
    document.getElementById('legendPrev').disabled = legendPage === 0;
    document.getElementById('legendNext').disabled = legendPage === totalPages - 1;
  }

  document.getElementById('legendPrev').onclick = () => { if (legendPage > 0) { legendPage--; renderLegendPage(); } };
  document.getElementById('legendNext').onclick = () => { if (legendPage < totalPages - 1) { legendPage++; renderLegendPage(); } };

  renderLegendPage();
}

// 이번 주 지하수로 점수 TOP 5 — 1등 챔피언 카드 + 2~5등 row
function renderTop5(members) {
  const wrap = document.getElementById('top5Wrap');
  if (!wrap) return;
  const sorted = members
    .filter(m => m.score > 0)
    .sort((a, b) => (a.rank || 0) - (b.rank || 0));
  const top5 = sorted.slice(0, 5);
  if (!top5.length) {
    wrap.innerHTML = '<div class="lb-empty">데이터 없음</div>';
    return;
  }
  const [first, ...rest] = top5;
  const REST_MEDALS = ['2', '3', '4', '5'];
  const championHTML = `
    <div class="top5-champion">
      <div class="top5-crown">1</div>
      <div class="top5-champion-meta">
        <div class="top5-champion-label">1위</div>
        <div class="top5-champion-name">${escapeAttr(first.name)}</div>
        <div class="top5-champion-job">${escapeAttr(normalizeJob(first.job))}</div>
      </div>
      <div class="top5-champion-score">${fmt(first.score)}<span class="top5-champion-score-unit">점</span></div>
    </div>
  `;
  const listHTML = rest.map((r, i) => {
    const rank = i + 2;
    return `
      <div class="top5-row rank-${rank}">
        <div class="top5-medal">${REST_MEDALS[i]}</div>
        <div class="top5-meta">
          <div class="top5-name">${escapeAttr(r.name)}</div>
          <div class="top5-job">${escapeAttr(normalizeJob(r.job))}</div>
        </div>
        <div class="top5-score">${fmt(r.score)}<span class="top5-score-unit">점</span></div>
      </div>
    `;
  }).join('');
  wrap.innerHTML = championHTML + `<div class="top5-list">${listHTML}</div>`;
}

function renderDistChart(members) {
  const active = members.filter(m => m.score > 0).map(m => m.score);
  const STEP = 10000;
  const maxScore = active.length ? Math.max(...active) : STEP;
  const topBracket = Math.ceil(maxScore / STEP) * STEP;

  const brackets = [{ label: '0점', count: members.filter(m => m.score === 0).length }];
  for (let lo = 0; lo < topBracket; lo += STEP) {
    const hi = lo + STEP;
    const label = lo === 0 ? `~1만` : `${lo / 10000}만~${hi / 10000}만`;
    brackets.push({ label, count: active.filter(s => s > lo && s <= hi).length });
  }

  if (distChart) distChart.destroy();
  distChart = new Chart(document.getElementById('distChart'), {
    type: 'bar',
    data: {
      labels: brackets.map(b => b.label),
      datasets: [{
        label: '인원 수',
        data: brackets.map(b => b.count),
        backgroundColor: 'rgba(49,130,246,0.6)',
        borderColor: '#3182F6',
        borderWidth: 1,
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ` ${ctx.parsed.y}명` }
      }},
      scales: {
        x: { grid: { color: cssVar('--line') }, ticks: { color: cssVar('--muted') } },
        y: { grid: { color: cssVar('--line') }, ticks: { color: cssVar('--muted'), stepSize: 1 } }
      }
    }
  });
}

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

function renderFullTable(members) {
  const tbody = document.getElementById('fullTbody');
  tbody.innerHTML = members.map(m => `<tr>
    <td  style="color:var(--muted);font-size:0.8rem">${m.rank}</td>
    <td>${m.name}</td>
    <td><span class="rank-job">${m.job}</span></td>
    <td class="${m.score === 0 ? 'zero-score' : ''}"  style="font-weight:800">
      ${m.score === 0 ? '—' : fmt(m.score)}
    </td>
    <td >
      <button type="button" class="history-btn" data-name="${escapeAttr(m.name)}">히스토리</button>
    </td>
  </tr>`).join('');
  document.getElementById('tableInfo').textContent = `${members.length}명 표시 중`;
}

function filterTable(query) {
  const q = query.trim().toLowerCase();
  filteredMembers = q
    ? allMembers.filter(m => m.name.toLowerCase().includes(q) || m.job.toLowerCase().includes(q))
    : [...allMembers];
  renderFullTable(filteredMembers);
}

function weekLabel(w) {
  return `${w.slice(0,4)}-${w.slice(4,6)}-${w.slice(6,8)}`;
}

function setStatLabels(week) {
  const prefix = week ? `(${weekRangeLabel(week)}) ` : '';
  document.getElementById('labelTotal').textContent  = `${prefix}총 길드원`;
  document.getElementById('labelActive').textContent = `${prefix}수로 참여자`;
  document.getElementById('labelScore').textContent  = `${prefix}수로 총 점수`;
}

function setWeekBadge(week) {
  const badge = week ? `— ${weekLabel(week)}` : '';
  document.getElementById('distWeekBadge').textContent = badge;
  document.getElementById('tableWeekBadge').textContent = badge;
}

async function loadWeekData(week) {
  const res = await fetch(`/api/week/${week}`);
  if (!res.ok) return;
  const data = await res.json();
  const members = normalizeMembers(data.all_members);
  allMembers = members;
  filteredMembers = [...members];
  setWeekBadge(week);
  setStatLabels(week);

  const scores = members.map(m => m.score).filter(s => s > 0);
  renderStats({
    total: members.length,
    active: scores.length,
    total_score: scores.reduce((a, b) => a + b, 0),
    updated_at: weekLabel(week),
  });

  renderAnalysis(members);
  renderDistChart(members);
  renderFullTable(members);
  document.getElementById('searchInput').value = '';
}

function weekRangeLabel(w) {
  const end = new Date(`${w.slice(0,4)}-${w.slice(4,6)}-${w.slice(6,8)}`);
  const start = new Date(end);
  start.setDate(end.getDate() - 6);
  const f = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${f(start)}~${f(end)}`;
}

function renderStatTrendChart(history) {
  const labels = history.map(h => weekRangeLabel(h.week));
  const mk = (label, data, color, dash) => ({
    label, data,
    borderColor: color,
    backgroundColor: 'transparent',
    borderWidth: 2,
    borderDash: dash || [],
    pointRadius: 3,
    pointHoverRadius: 6,
    tension: 0.3,
  });

  if (statTrendChart) statTrendChart.destroy();
  statTrendChart = new Chart(document.getElementById('statTrendChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        mk('Q3 (상위 25%)',  history.map(h => h.q3),           '#8B95A1'),
        mk('평균',           history.map(h => h.mean),          '#00A661'),
        mk('중간값 (Q2)',    history.map(h => h.median_score),  '#3182F6'),
        mk('Q1 (하위 25%)', history.map(h => h.q1),            '#F04452', [4,3]),
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#8899bb', font: { size: 12 }, boxWidth: 24 } },
        tooltip: {
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` }
        }
      },
      scales: {
        x: { grid: { color: cssVar('--line') }, ticks: { color: cssVar('--muted') } },
        y: { grid: { color: cssVar('--line') }, ticks: { color: cssVar('--muted'), callback: v => fmt(v) } }
      }
    }
  });
}

function renderBriefing(history) {
  const el = document.getElementById('briefingBoard');
  if (history.length < 2) { el.innerHTML = ''; return; }

  const cur  = history[history.length - 1];
  const prev = history[history.length - 2];

  const atHigh = k => Math.max(...history.map(h => h[k]));
  const atLow  = k => Math.min(...history.filter(h => h[k] > 0).map(h => h[k]));

  // 연속 성장/하락 주수
  const isUp = cur.total_score >= prev.total_score;
  let streak = 1;
  for (let i = history.length - 2; i > 0; i--) {
    const up = history[i].total_score >= history[i-1].total_score;
    if (up === isUp) streak++; else break;
  }

  function chg(c, p, unit='', reversed=false) {
    const diff = c - p;
    const pct  = p > 0 ? ((diff / p) * 100).toFixed(1) : '0.0';
    const good = reversed ? diff <= 0 : diff >= 0;
    const cls  = diff === 0 ? 'flat' : good ? 'up' : 'down';
    const arr  = diff > 0 ? '▲' : diff < 0 ? '▼' : '━';
    const sign = diff > 0 ? '+' : '';
    return `<div class="brief-change ${cls}">${arr} ${sign}${fmt(Math.abs(diff))}${unit} (${sign}${pct}%)</div>`;
  }

  function bar(c, best, reversed=false) {
    const pct = best > 0 ? Math.min(100, Math.round((reversed ? best/c : c/best)*100)) : 0;
    const lbl = reversed ? `역대 최저: ${fmt(best)}` : `역대 최고: ${fmt(best)}`;
    const ref = reversed ? '최저 대비' : '최고 대비';
    return `<div class="brief-record">${lbl}</div>
            <div class="brief-bar-wrap"><div class="brief-bar" style="width:${pct}%"></div></div>
            <div class="brief-pct">${ref} ${pct}%</div>`;
  }

  function card(label, c, p, best, unit='', reversed=false) {
    return `<div class="brief-card">
      <div class="brief-card-label">${label}</div>
      <div class="brief-card-value">${fmt(c)}${unit}</div>
      ${chg(c, p, unit, reversed)}
      ${bar(c, best, reversed)}
    </div>`;
  }

  el.innerHTML = `
    <div class="brief-banner ${isUp ? 'up' : 'down'}">
      <span class="brief-icon">${isUp ? '↑' : '↓'}</span>
      <span>이번 주 길드는 지난 주보다 ${isUp ? '성장했습니다' : '하향됐습니다'}</span>
      <span class="brief-streak">${streak}주 연속 ${isUp ? '성장' : '하락'} 중</span>
    </div>
    <div class="brief-group-label">주요 지표</div>
    <div class="brief-grid-3">
      ${card('길드 총 점수',   cur.total_score,   prev.total_score,   atHigh('total_score'))}
      ${card('이번 주 참여자', cur.active,         prev.active,         atHigh('active'), '명')}
      ${card('평균 점수',      cur.mean,           prev.mean,           atHigh('mean'))}
    </div>
    <div class="brief-group-label">분포 지표</div>
    <div class="brief-grid-4">
      ${card('Q1 · 하위 25%', cur.q1,           prev.q1,           atHigh('q1'))}
      ${card('Q2 · 중간값',   cur.median_score, prev.median_score, atHigh('median_score'))}
      ${card('Q3 · 상위 25%', cur.q3,           prev.q3,           atHigh('q3'))}
      ${card('표준편차',       cur.stddev,        prev.stddev,        atLow('stddev'), '', true)}
    </div>`;
}

function renderHistoryChart(history) {
  const labels  = history.map(h => weekRangeLabel(h.week));
  const totals  = history.map(h => h.total_score);
  const medians = history.map(h => h.median_score);
  const actives = history.map(h => h.active);

  if (historyChart) historyChart.destroy();
  historyChart = new Chart(document.getElementById('historyChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '길드 총점수',
        data: totals,
        borderColor: '#3182F6',
        backgroundColor: 'rgba(49,130,246,0.12)',
        borderWidth: 2,
        pointRadius: 6,
        pointHoverRadius: 10,
        pointHitRadius: 24,
        fill: true,
        tension: 0.3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      onHover: (e, elements) => {
        e.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      },
      onClick: (_, elements) => {
        if (!elements.length) return;
        const week = history[elements[0].index].week;
        loadWeekData(week);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: ctx => weekLabel(history[ctx[0].dataIndex].week),
            afterBody: ctx => {
              const i = ctx[0].dataIndex;
              return [`중간값: ${fmt(medians[i])}`, `참여인원: ${actives[i]}명`];
            },
            label: ctx => ` 총점수: ${fmt(ctx.parsed.y)}`,
          }
        }
      },
      scales: {
        x: { grid: { color: cssVar('--line') }, ticks: { color: cssVar('--muted') } },
        y: { grid: { color: cssVar('--line') }, ticks: { color: cssVar('--muted'), callback: v => fmt(v) } }
      }
    }
  });
}

function renderFineTable(members, week) {
  const tbody = document.getElementById('fineTbody');
  tbody.innerHTML = members.map(m => {
    const isAlreadyFined = m.last_fine_week === week;
    const btnText = isAlreadyFined ? '벌금 취소' : '벌금 납부 확인';
    const btnClass = isAlreadyFined ? 'fine-btn fine-btn-cancel' : 'fine-btn';

    // 연속 미참 배지
    const cm = m.consecutive_misses || 0;
    const missBadge = cm >= 2
      ? `<button type="button" class="miss-badge" disabled aria-disabled="true">${cm}주 연속 미참</button>`
      : '';

    // 지난주 미납부 라벨 — 이월 또는 미해결 2건 이상
    const pendingCount = m.pending_count || 0;

    const carryoverBadge = showCarryover
      ? `<button type="button" class="carryover-badge" disabled aria-disabled="true">지난주 미납부 인원</button>`
      : '';

    return `<tr>
      <td  style="color:var(--muted);font-size:0.8rem">${m.rank}</td>
      <td>${m.name}${carryoverBadge}${missBadge}</td>

        <div class="fine-action-group">
          <button type="button" class="${btnClass}" data-name="${escapeAttr(m.name)}" data-rank="${m.rank}" data-fine-count="${m.fine_count}" data-pending-count="${pendingCount}" data-is-fined="${isAlreadyFined}">${btnText}</button>
          <button type="button" class="leave-btn" data-name="${escapeAttr(m.name)}">길드 탈퇴</button>

function showFineConfirmModal(name, rank, fineCount, pendingCount, week) {
  currentFineData = { name, rank, fineCount, pendingCount, week };
  const currentCount = parseInt(fineCount) || 0;
  const processCount = Math.max(parseInt(pendingCount) || 0, 1);
  const newCount = currentCount + processCount;

  // 누진 산식 합산: amount(N회차) = 10 + (N - 1)
  let totalAmount = 0;
  for (let fc = currentCount + 1; fc <= newCount; fc++) {
    totalAmount += 10 + (fc - 1);
  }

  const batchLine = processCount > 1
    ? `<br><span style="color:#fb923c;font-weight:700;">미해결 ${processCount}건 일괄 처리</span>`
    : '';

  document.getElementById('fineConfirmText').innerHTML = `
    <strong>${name}</strong> 길드원의 벌금을 확인하시겠습니까?${batchLine}<br><br>
    현재 누적 횟수: <strong>${currentCount}</strong>회<br>
    부과 건수: <strong>${processCount}</strong>건<br>
    총 벌금: 솔 에르다 조각 <strong>${fmt(totalAmount)}</strong> 개
  `;
  document.getElementById('fineAmountInfo').innerHTML = `
    부과 후 누적 횟수: <strong>${newCount}</strong>회
  `;
  document.getElementById('fineConfirmModal').classList.add('show');
}

function renderDeltaList(rows, kind) {
  // kind: 'rise' | 'drop'
  if (!rows.length) return '<div class="lb-empty">데이터 없음</div>';
  const cls = kind === 'rise' ? 'rise' : 'drop';
  return `<div class="lb-list">` + rows.map((r, i) => {
    const sign = r.delta > 0 ? '+' : '';
    return `
    <div class="lb-row rank-${i + 1}">
      <div class="lb-medal">${MEDALS[i] ?? (i + 1)}</div>
      <div class="lb-meta">
        <div class="lb-name">${escapeAttr(r.name)}</div>
        <div class="lb-job">${escapeAttr(normalizeJob(r.job))}</div>
      </div>
      <div class="lb-value ${cls}">${sign}${fmt(r.delta)}</div>
    </div>
    `;
  }).join('') + `</div>`;
}

async function init() {
  // 공개 페이지: 통계 + 차트 + 통계 분석 + 평균등수/상승폭 TOP 5 + 전체 길드원
  const [data, history] = await Promise.all([fetchData(), fetch('/api/history').then(r => r.json())]);
  data.all_members = normalizeMembers(data.all_members);
  allMembers = data.all_members;
  filteredMembers = [...allMembers];
  currentWeek = data.stats.week;

  renderStats(data.stats);
  setStatLabels(data.stats.week);
  renderBriefing(history);
  renderHistoryChart(history);
  renderStatTrendChart(history);
  renderAnalysis(data.all_members);
  renderDistChart(data.all_members);

  // 이번 주 TOP 5 — top30(없으면 all_members) 기반
  const top5Source = (data.top30 && data.top30.length) ? data.top30 : data.all_members;
  renderTop5(top5Source);
  const top5Badge = document.getElementById('top5WeekBadge');
  if (top5Badge && data.stats) {
    top5Badge.textContent = data.stats.week_display
      ? `${data.stats.week_display} 기준`
      : `${data.stats.week} 기준`;
  }

  // 공개 리더보드 (평균등수 + 상승폭만 응답에 포함됨)
  await fetchAndRenderLeaderboards();

  // 전체 길드원 현황
  renderFullTable(data.all_members);
  document.getElementById('searchInput').addEventListener('input', e => filterTable(e.target.value));
}

    'width=1000,height=800,noopener'
  );
});

const _fineTbodyEl = document.getElementById('fineTbody');
if (_fineTbodyEl) _fineTbodyEl.addEventListener('click', e => {
  const leaveBtn = e.target.closest('.leave-btn');
  if (leaveBtn) {
    showLeaveGuildModal(leaveBtn.dataset.name);
    return;
  }
  const btn = e.target.closest('.fine-btn');
  if (!btn) return;
  const name = btn.dataset.name;
  const rank = btn.dataset.rank;
  const fineCount = parseInt(btn.dataset.fineCount);
  const pendingCount = parseInt(btn.dataset.pendingCount) || 0;
  const isFined = btn.dataset.isFined === 'true';

  if (isFined) {
    showFineUndoModal(name, fineCount, 0, currentWeek, true);
  } else {
    showFineConfirmModal(name, rank, fineCount, pendingCount, currentWeek);
  }
});

// 5분마다 자동 갱신
init();
setInterval(init, 5 * 60 * 1000);
</script>
</body>
</html>
