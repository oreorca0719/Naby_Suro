<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>길드원 히스토리</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --fill-2:    #F9FAFB;
      --bg:        #F7F8FA;
      --surface:   #FFFFFF;
      --card:      #FFFFFF;
      --fill:      #F2F4F6;
      --border:    #E9ECEF;
      --accent:    #3182F6;
      --accent2:   #FFB020;
      --gold:      #3182F6;
      --silver:    #8B95A1;
      --bronze:    #8B95A1;
      --text:      #191F28;
      --ink-2:     #4E5968;
      --muted:     #8B95A1;
      --radius:    18px;
      --danger:    #F04452;
      --green:     #00A661;
      --up:        #00A661;
      --yellow:    #FFB020;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fill-2:  #212429;
        --bg:      #15171A;
        --surface: #1B1E22;
        --card:    #1B1E22;
        --fill:    #24282E;
        --border:  #2E333A;
        --accent:  #4D93F8;
        --accent2: #FFC14D;
        --gold:    #4D93F8;
        --silver:  #7B848F;
        --bronze:  #7B848F;
        --text:    #EDEFF2;
        --ink-2:   #B0B8C1;
        --muted:   #7B848F;
        --danger:  #FF6B75;
        --green:   #2FCB86;
        --up:      #2FCB86;
        --yellow:  #FFC14D;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      min-height: 100vh;
      padding: 32px;
    }

    .wrapper { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; width: 100%; box-sizing: border-box; }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-weight: 800; letter-spacing: -0.035em;
      font-size: 1.8rem;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.04em; }

    .back-link {
      font-size: 0.78rem;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      transition: background 0.15s;
    }
    .back-link:hover { background: rgba(49,130,246,0.1); }

    .card {
      background: var(--surface);
      border-radius: var(--radius, 18px);
      padding: 24px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
      color: var(--text);
    }

    .chart-wrap { position: relative; height: 340px; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .stat-box-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; }
    .stat-box-value { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.035em; color: var(--text); margin-top: 4px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th {
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    td { 
      padding: 9px 14px; 
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    /* 모든 열 center 정렬로 통일.
       이전에는 th/td:last-child 를 right 로 뒀는데, 비관리자일 때
       '누적 납부 횟수' 헤더만 display:none 으로 숨고 DOM 에는 남아
       th(4/5번째)는 center, td(4/4번째)는 :last-child 로 right 가 되어
       점수 열의 헤더와 값이 어긋났다. */
    td { font-variant-numeric: tabular-nums; }
    tbody tr:hover { background: rgba(49,130,246,0.04); }
    .zero { color: var(--muted); }
    .score-cell { font-weight: 800; letter-spacing: -0.035em; color: var(--accent2); }

    .rank-job-tag {
      font-size: 0.72rem;
      color: var(--muted);
      background: rgba(49,130,246,0.08);
      border: 1px solid rgba(49,130,246,0.15);
      border-radius: 4px;
      padding: 2px 8px;
      display: inline-block;
    }

    /* ── FINE BADGE (상세 기록 상단 누적 벌금 표시) ── */
    .fine-badge-wrap { margin: 0 0 14px; }
    .fine-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid;
      pointer-events: none;
      user-select: none;
      letter-spacing: 0.02em;
    }
    .fine-badge:disabled { opacity: 1; cursor: default; }
    .fine-badge.clean {
      background: rgba(0,166,97,0.12);
      border-color: rgba(0,166,97,0.4);
      color: var(--green);
    }
    .fine-badge.alert {
      background: rgba(240,68,82,0.12);
      border-color: rgba(240,68,82,0.4);
      color: var(--danger);
    }

    .empty {
      color: var(--muted);
      padding: 60px 20px;
      text-align: center;
      font-size: 0.95rem;
    }

    /* ── PROFILE CARD ── */
    .profile-grid {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 24px;
      align-items: center;
    }
    .profile-img-wrap {
      width: 160px;
      height: 160px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .profile-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      transform: scale(1.8);
      transform-origin: center;
    }
    .profile-img-wrap.empty-img { color: var(--muted); font-size: 0.78rem; }
    .profile-info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .profile-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
    }
    .profile-item-label {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .profile-item-value {
      font-size: 1.05rem;
      font-weight: 800; letter-spacing: -0.035em;
      color: var(--text);
    }
    .profile-item-value.combat { color: var(--accent2); font-size: 1.2rem; }
    .profile-item-sub { font-size: 0.7rem; color: var(--muted); margin-left: 6px; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; }

    .hexa-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .hexa-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .hexa-name { font-size: 0.82rem; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hexa-level {
      font-weight: 800; letter-spacing: -0.035em;
      font-size: 0.95rem;
      color: var(--accent);
      flex-shrink: 0;
    }
    .hexa-type-tag {
      font-size: 0.65rem;
      color: var(--muted);
      background: rgba(49,130,246,0.08);
      border: 1px solid rgba(49,130,246,0.15);
      border-radius: 4px;
      padding: 1px 6px;
      flex-shrink: 0;
    }
    .profile-error {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    @media (max-width: 1024px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .wrapper { max-width: 100%; }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding-bottom: 16px;
        margin-bottom: 20px;
      }
      h1 { font-size: 1.5rem; }
      .subtitle { font-size: 0.75rem; }
      .back-link { font-size: 0.7rem; padding: 5px 10px; }
      .card { padding: 16px; margin-bottom: 16px; border-radius: 8px; }
      .section-title { font-size: 0.85rem; margin-bottom: 12px; }
      .chart-wrap { height: 280px; }
      .profile-grid { grid-template-columns: 1fr; gap: 16px; }
      .profile-img-wrap { width: 140px; height: 140px; margin: 0; }
      .profile-info-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .profile-item { padding: 10px 12px; }
      .profile-item-label { font-size: 0.65rem; }
      .profile-item-value { font-size: 0.95rem; }
      .hexa-list { grid-template-columns: 1fr; }
      .hexa-item { padding: 8px 12px; }
      .hexa-name { font-size: 0.75rem; }
      .hexa-level { font-size: 0.85rem; }
      .stats-row { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-box { padding: 10px 12px; }
      .stat-box-label { font-size: 0.65rem; }
      .stat-box-value { font-size: 1rem; }
      table { font-size: 0.75rem; }
      th { font-size: 0.65rem; padding: 8px 10px; }
      td { padding: 7px 10px; }
      .fine-badge { font-size: 0.78rem; padding: 7px 14px; }
    }

    @media (max-width: 480px) {
      body { padding: 16px; font-size: 13px; }
      header { padding-bottom: 12px; margin-bottom: 16px; }
      h1 { font-size: 1.2rem; }
      .subtitle { font-size: 0.65rem; }
      .back-link { font-size: 0.65rem; padding: 4px 8px; }
      .card { padding: 12px; margin-bottom: 12px; }
      .section-title { font-size: 0.75rem; margin-bottom: 10px; }
      .chart-wrap { height: 220px; }
      .profile-grid { gap: 12px; }
      .profile-img-wrap { width: 120px; height: 120px; }
      .profile-img-wrap img { transform: scale(1.5); }
      .profile-info-grid { grid-template-columns: 1fr; gap: 10px; }
      .profile-item { padding: 8px 10px; }
      .profile-item-label { font-size: 0.6rem; }
      .profile-item-value { font-size: 0.85rem; }
      .profile-item-value.combat { font-size: 1rem; }
      .hexa-list { gap: 8px; }
      .hexa-item { padding: 6px 10px; }
      .hexa-name { font-size: 0.7rem; }
      .hexa-level { font-size: 0.75rem; }
      .hexa-type-tag { font-size: 0.55rem; padding: 1px 5px; }
      .stats-row { grid-template-columns: 1fr; gap: 8px; }
      .stat-box { padding: 8px 10px; }
      .stat-box-label { font-size: 0.6rem; }
      .stat-box-value { font-size: 0.9rem; }
      table { font-size: 0.7rem; }
      th { font-size: 0.6rem; padding: 6px 8px; }
      td { padding: 6px 8px; }
      .fine-badge { font-size: 0.72rem; padding: 6px 12px; }
      .fine-badge-wrap { margin-bottom: 10px; }
    }

    /* 환산 분석 외부 링크 버튼 */
    .external-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      background: rgba(49,130,246,0.10);
      border: 1px solid rgba(49,130,246,0.35);
      border-radius: 5px;
      color: var(--accent);
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .external-link-btn:hover {
      background: rgba(49,130,246,0.22);
      border-color: var(--accent);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--muted);
      gap: 10px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }


    /* ── 모션 ───────────────────────────────
       장식이 아니라 피드백. 진입할 때 한 번 떠오르고, 조작에는 즉시 반응한다.
       거리는 짧게(10px), 시간은 짧게(0.4s 이내). */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    .brief-banner,
    .brief-grid-3 > .brief-card,
    .brief-grid-4 > .brief-card,
    .wrapper > .card,
    .wrapper > .full-table-section,
    .leaderboard-row-public > .card {
      animation: riseIn 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    /* 순차 등장 — 같은 줄의 카드들이 왼쪽부터 차례로 */
    .brief-grid-3 > .brief-card:nth-child(2),
    .brief-grid-4 > .brief-card:nth-child(2),
    .leaderboard-row-public > .card:nth-child(2) { animation-delay: 0.06s; }
    .brief-grid-3 > .brief-card:nth-child(3),
    .brief-grid-4 > .brief-card:nth-child(3) { animation-delay: 0.12s; }
    .brief-grid-4 > .brief-card:nth-child(4) { animation-delay: 0.18s; }

    /* 행 hover — 어디를 보고 있는지 알려준다 */
    .top5-row, .lb-row { transition: background 0.15s; }
    .top5-row:hover, .lb-row:hover { background: var(--fill-2); }

    /* 누름 반응 */
    button, .admin-link-btn { transition: background 0.15s, border-color 0.15s, transform 0.08s; }
    button:active, .admin-link-btn:active { transform: scale(0.97); }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.4s; }
      * { transition: none !important; }
      .brief-banner, .brief-card, .card, .full-table-section { animation: none !important; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <div>
      <h1 id="memberName">불러오는 중...</h1>
      <div class="subtitle" id="memberJob"></div>
    </div>
    <a href="/" class="back-link" target="_self">← 대시보드</a>
  </header>

  <div class="card" id="profileCard">
    <div class="section-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      캐릭터 정보
      <a id="mapleScouterLink" class="external-link-btn" target="_blank" rel="noopener">환산 사이트 ↗</a>
    </div>
    <div id="profileContainer">
      <div class="loading"><div class="spinner"></div> 캐릭터 정보 불러오는 중</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">주차별 지하수로 점수 추이</div>
    <div id="chartContainer">
      <div class="loading"><div class="spinner"></div> 불러오는 중</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">상세 기록</div>
    <div class="fine-badge-wrap" id="fineBadgeWrap"></div>
    <table id="histTable">
      <thead>
        <tr>
          <th>주차</th>
          <th>순위</th>
          <th>직업</th>
          <th>점수</th>
          <th id="fineCountHeader">누적 납부 횟수</th>
        </tr>
      </thead>
      <tbody id="histTbody"></tbody>
    </table>
  </div>

</div>

<script>
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fmt(n) { return Number(n).toLocaleString('ko-KR'); }

/* 큰 수치를 현재 표시값 → 목표값으로 굴려서 채운다.
   첫 진입은 0 부터, 갱신 시에는 이전 값부터 이어져 깜빡이지 않는다. */
function countUp(el, to, suffix = '') {
  if (!el) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const from = Number(String(el.textContent).replace(/[^\d]/g, '')) || 0;
  // 배경 탭이면 rAF 가 멈춰 값이 갱신되지 않으므로 곧바로 최종값을 쓴다
  if (reduce || from === to || document.hidden) { el.innerHTML = fmt(to) + suffix; return; }

  const DURATION = 800;
  const t0 = performance.now();
  let done = false;
  const tick = (now) => {
    const p = Math.min((now - t0) / DURATION, 1);
    const eased = 1 - Math.pow(1 - p, 3);          // easeOutCubic
    el.innerHTML = fmt(Math.round(from + (to - from) * eased)) + suffix;
    if (p < 1) requestAnimationFrame(tick); else done = true;
  };
  requestAnimationFrame(tick);
  // rAF 가 도중에 멈춰도(탭 전환 등) 최종값은 반드시 표시되도록 보정
  setTimeout(() => { if (!done) el.innerHTML = fmt(to) + suffix; }, DURATION + 400);
}

const params = new URLSearchParams(window.location.search);
const name = params.get('name');

if (!name) {
  document.querySelector('.wrapper').innerHTML = '<div class="empty">name 파라미터가 필요합니다.</div>';
} else {
  document.title = `${name} - 길드원 히스토리`;
  // 환산 분석(MapleScouter) 외부 링크 설정
  const scouterLink = document.getElementById('mapleScouterLink');
  if (scouterLink) {
    scouterLink.href = `https://maplescouter.com/ko/info?name=${encodeURIComponent(name)}`;
  }
  fetch(`/api/member/${encodeURIComponent(name)}`)
    .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
    .then(render)
    .catch(err => {
      document.querySelector('.wrapper').innerHTML = `<div class="empty">불러오기 실패: ${err.message}</div>`;
    });
  loadProfile(name);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadProfile(name) {
  const container = document.getElementById('profileContainer');
  try {
    const res = await fetch(`/api/member/${encodeURIComponent(name)}/profile`);
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      const msg = res.status === 404
        ? '넥슨 API에서 이 닉네임의 캐릭터를 찾을 수 없습니다.'
        : res.status === 503
        ? 'NEXON_API_KEY가 서버에 설정되어 있지 않습니다.'
        : `넥슨 API 오류 (${detail.detail || res.status})`;
      container.innerHTML = `<div class="profile-error">${msg}</div>`;
      return;
    }
    const p = await res.json();
    renderProfile(p);
  } catch (err) {
    container.innerHTML = `<div class="profile-error">캐릭터 정보 로드 실패: ${escapeHtml(err.message)}</div>`;
  }
}

function renderProfile(p) {
  const container = document.getElementById('profileContainer');

  const img = p.image
    ? `<img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name || '')}" loading="lazy" />`
    : '캐릭터 초상화 없음';
  const imgClass = p.image ? 'profile-img-wrap' : 'profile-img-wrap empty-img';

  const level = p.level != null ? `Lv. ${p.level}` : '—';
  const expRate = p.exp_rate != null ? `<span class="profile-item-sub">${escapeHtml(p.exp_rate)}%</span>` : '';
  const job = p.job ? `${escapeHtml(p.job)}${p.job_level ? ` <span class="profile-item-sub">${escapeHtml(p.job_level)}</span>` : ''}` : '—';
  const world = p.world ? escapeHtml(p.world) : '—';
  const cp = p.combat_power != null ? fmt(p.combat_power) : '—';

  const hexaHtml = (p.hexa_cores && p.hexa_cores.length)
    ? `<div class="hexa-list">${p.hexa_cores.map(c => `
        <div class="hexa-item">
          <span class="hexa-name" title="${escapeHtml(c.name || '')}">${escapeHtml(c.name || '—')}</span>
          ${c.type ? `<span class="hexa-type-tag">${escapeHtml(c.type)}</span>` : ''}
          <span class="hexa-level">Lv.${c.level ?? '—'}</span>
        </div>`).join('')}</div>`
    : `<div class="profile-error" style="padding:12px;">HEXA 코어 정보 없음</div>`;

  container.innerHTML = `
    <div class="profile-grid">
      <div class="${imgClass}">${img}</div>
      <div class="profile-info-grid">
        <div class="profile-item">
          <div class="profile-item-label">레벨</div>
          <div class="profile-item-value">${level}${expRate}</div>
        </div>
        <div class="profile-item">
          <div class="profile-item-label">전투력</div>
          <div class="profile-item-value combat">${cp}</div>
        </div>
        <div class="profile-item">
          <div class="profile-item-label">직업</div>
          <div class="profile-item-value">${job}</div>
        </div>
        <div class="profile-item">
          <div class="profile-item-label">월드</div>
          <div class="profile-item-value">${world}</div>
        </div>
      </div>
    </div>
    <div style="margin-top:20px;">
      <div class="section-title" style="font-size:0.85rem;margin-bottom:10px;">HEXA 코어</div>
      ${hexaHtml}
    </div>
  `;
}

function render(data) {
  const hist = data.history;
  // 벌금 누적 횟수는 관리자 응답에만 포함됨. 공개 접근 시 fine_count 키 자체가 없음 → 표시 안 함.
  const showFine = ('fine_count' in data);
  const fineCount = data.fine_count || 0;
  document.getElementById('memberName').textContent = data.name;

  if (!hist || !hist.length) {
    document.getElementById('memberJob').textContent = '기록 없음';
    document.getElementById('chartContainer').innerHTML = '<div class="empty">이 길드원의 기록이 없습니다.</div>';
    return;
  }

  const latest = hist[hist.length - 1];
  document.getElementById('memberJob').textContent = `${latest.job} · 최근 ${latest.week_display} (현 순위 ${latest.rank}위)`;

  // 누적 벌금 배지 (관리자 접근 시에만)
  if (showFine) {
    const badgeClass = fineCount > 0 ? 'alert' : 'clean';
    document.getElementById('fineBadgeWrap').innerHTML =
      `<button type="button" class="fine-badge ${badgeClass}" disabled aria-disabled="true">누적 납부 횟수 ${fineCount}회</button>`;
  } else {
    document.getElementById('fineBadgeWrap').innerHTML = '';
  }

  // 차트
  document.getElementById('chartContainer').innerHTML = `
    <div class="chart-wrap"><canvas id="memberChart"></canvas></div>
    <div class="stats-row" id="statsRow"></div>
  `;

  const labels = hist.map(h => h.week_display);
  const scores = hist.map(h => h.score);

  new Chart(document.getElementById('memberChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '지하수로 점수',
        data: scores,
        borderColor: '#3182F6',
        backgroundColor: 'rgba(49,130,246,0.12)',
        borderWidth: 2,
        pointRadius: 5,
        pointHoverRadius: 9,
        pointHitRadius: 20,
        fill: true,
        tension: 0.3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            afterBody: ctx => {
              const h = hist[ctx[0].dataIndex];
              return [`순위: ${h.rank}`, `직업: ${h.job}`];
            },
            label: ctx => ` 점수: ${fmt(ctx.parsed.y)}`,
          }
        }
      },
      scales: {
        x: { grid: { color: cssVar('--border') }, ticks: { color: cssVar('--muted') } },
        y: { grid: { color: cssVar('--border') }, ticks: { color: cssVar('--muted'), callback: v => fmt(v) } }
      }
    }
  });

  // 요약 통계
  const active = scores.filter(s => s > 0);
  const max = active.length ? Math.max(...active) : 0;
  const min = active.length ? Math.min(...active) : 0;
  const avg = active.length ? Math.round(active.reduce((a,b)=>a+b,0) / active.length) : 0;
  const first = active[0] ?? 0;
  const last  = active[active.length - 1] ?? 0;
  const growth = active.length >= 2 ? last - first : 0;
  const growthColor = growth > 0 ? '#00A661' : growth < 0 ? '#F04452' : 'var(--muted)';
  const growthSign  = growth > 0 ? '+' : '';

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-box"><div class="stat-box-label">최고 점수</div><div class="stat-box-value">${fmt(max)}</div></div>
    <div class="stat-box"><div class="stat-box-label">최저 점수</div><div class="stat-box-value">${fmt(min)}</div></div>
    <div class="stat-box"><div class="stat-box-label">평균 점수</div><div class="stat-box-value">${fmt(avg)}</div></div>
    <div class="stat-box"><div class="stat-box-label">기록 변화</div><div class="stat-box-value" style="color:${growthColor}">${growthSign}${fmt(growth)}</div></div>
  `;

  // 상세표 (최신 주차 위로) — 누적 납부 횟수 컬럼은 관리자 접근 시에만
  const fineHeader = document.getElementById('fineCountHeader');
  if (fineHeader) fineHeader.style.display = showFine ? '' : 'none';

  const tbody = document.getElementById('histTbody');
  tbody.innerHTML = hist.slice().reverse().map(h => `<tr>
    <td>${h.week_display}</td>
    <td>${h.rank}</td>
    <td><span class="rank-job-tag">${h.job}</span></td>
    <td class="${h.score === 0 ? 'zero' : 'score-cell'}">${h.score === 0 ? '—' : fmt(h.score)}</td>
    ${showFine ? `<td style="text-align:center;">${h.fine_count > 0 ? h.fine_count + '회' : '—'}</td>` : ''}
  </tr>`).join('');
}
</script>
</body>
</html>
