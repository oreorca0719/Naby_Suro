<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나비 길드 대시보드</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --fill-2:    #F9FAFB;
      --line:      #E9ECEF;
      --radius:    18px;
      --radius-sm: 12px;
      --bg:        #F7F8FA;
      --surface:   #FFFFFF;
      --card:      #FFFFFF;
      --fill:      #F2F4F6;
      --border:    #E9ECEF;
      --accent:    #3182F6;
      --accent2:   #FFB020;
      --gold:      #3182F6;
      --silver:    #8B95A1;
      --bronze:    #8B95A1;
      --text:      #191F28;
      --ink-2:     #4E5968;
      --muted:     #8B95A1;
      --danger:    #F04452;
      --green:     #00A661;
      --up:        #00A661;
      --yellow:    #FFB020;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fill-2:  #212429;
        --line:    #2E333A;
        --bg:      #15171A;
        --surface: #1B1E22;
        --card:    #1B1E22;
        --fill:    #24282E;
        --border:  #2E333A;
        --accent:  #4D93F8;
        --accent2: #FFC14D;
        --gold:    #4D93F8;
        --silver:  #7B848F;
        --bronze:  #7B848F;
        --text:    #EDEFF2;
        --ink-2:   #B0B8C1;
        --muted:   #7B848F;
        --danger:  #FF6B75;
        --green:   #2FCB86;
        --up:      #2FCB86;
        --yellow:  #FFC14D;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .wrapper { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 24px 60px; width: 100%; box-sizing: border-box; }

    /* ── 로그아웃 버튼 ── */
    .logout-btn {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      background: rgba(247,95,95,0.12);
      border: 1px solid rgba(247,95,95,0.4);
      color: var(--danger);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .logout-btn:hover {
      background: rgba(247,95,95,0.25);
      border-color: var(--danger);
    }

    /* ── PAGE TABS (개요/인사이트/관리) ── */
    .page-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .page-tab {
      padding: 12px 22px;
      color: var(--muted);
      text-decoration: none;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .page-tab:hover { color: var(--text); }
    .page-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    @media (max-width: 480px) {
      .page-tab { padding: 10px 16px; font-size: 0.82rem; }
      .page-tabs { margin-bottom: 20px; }
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 0 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .header-left h1 {
      font-weight: 800; letter-spacing: -0.035em;
      font-size: 2rem;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    .header-left .subtitle {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.08em;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .updated-at { font-size: 0.72rem; color: var(--muted); }

    /* ── STAT CARDS ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 22px 24px;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      display: none;
    }

    .stat-card:hover { border-color: var(--accent); }

    .stat-label {
      font-size: 0.85rem;
      color: var(--ink-2);
      font-weight: 600;
      margin-bottom: 10px;
    }
    .stat-value {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
    .stat-value span { font-size: 0.85rem; color: var(--muted); margin-left: 4px; font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; }

    /* ── SECTION TITLE ── */
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
      color: var(--text);
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── MAIN GRID ── */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
    }

    /* ── CHART ── */
    .chart-wrap { position: relative; height: 320px; }
    .stat-trend-wrap { position: relative; height: 420px; }

    /* ── JOB DONUT ── */
    .donut-wrap { position: relative; height: 320px; }

    /* ── LEADERBOARD ── */
    .leaderboard-stack {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .leaderboard-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }
    .lb-row:hover { background: rgba(49,130,246,0.10); }

    .job-legend {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
    }

    .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .legend-name { flex: 1; color: var(--text); }
    .legend-count { color: var(--muted); font-size: 0.72rem; }

    .legend-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    .legend-nav button {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 2px 10px;
      line-height: 1.6;
      transition: background 0.15s;
    }

    .legend-nav button:hover:not(:disabled) { background: var(--border); }
    .legend-nav button:disabled { opacity: 0.3; cursor: default; }
    .legend-page { font-size: 0.75rem; color: var(--muted); }

    /* ── STATS ANALYSIS ── */
    .analysis-block { margin-bottom: 16px; }
    .analysis-block:last-child { margin-bottom: 0; }
    .analysis-label {
      font-size: 0.82rem;
      color: var(--ink-2);
      font-weight: 600;
      margin-bottom: 7px;
    }
    .analysis-value {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
    }
    .analysis-desc {
      font-size: 0.85rem;
      color: var(--ink-2);
      font-weight: 600;
      line-height: 1.6;
      margin: 5px 0 8px;
    }
    .quartile-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .quartile-item {
      background: var(--fill-2);
      border-radius: var(--radius-sm);
      padding: 15px 16px;
    }
    .quartile-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .quartile-val {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .analysis-divider {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 22px 0;
    }

    /* ── RANKING TABLE ── */
    .rank-table { width: 100%; border-collapse: collapse; }

    .rank-table th {
      text-align: left;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0 12px 12px;
      border-bottom: 1px solid var(--border);
    }

    .rank-table th {
      text-align: center;
    }
    
    .rank-table th:first-child,
    .rank-table td:first-child {
      text-align: center;
    }
    
    .rank-table th:last-child,
    .rank-table td:last-child { text-align: center; }

    .rank-table td {
      padding: 10px 12px;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    
    .rank-table th:nth-child(2), .rank-table td:nth-child(2) {
      text-align: left;
    }
    
    .rank-table td:last-child {
      text-align: center;
    }

    .rank-table tbody tr {
      transition: background 0.15s;
    }

    .rank-table tbody tr:hover { background: rgba(49,130,246,0.05); }

    .rank-num {
      font-weight: 800; letter-spacing: -0.035em;
      font-size: 0.9rem;
      color: var(--muted);
      width: 36px;
      text-align: center;
    }

    .rank-num.gold   { color: var(--gold); }
    .rank-num.silver { color: var(--silver); }
    .rank-num.bronze { color: var(--bronze); }

    .rank-name { font-weight: 500; color: var(--text); }

    .rank-job {
      font-size: 0.78rem;
      color: var(--ink-2);
      background: var(--fill);
      padding: 3px 9px;
      border-radius: 7px;
      white-space: nowrap;
      font-weight: 600;
    }

    .rank-score {
      font-weight: 800; letter-spacing: -0.035em;
      font-size: 0.95rem;
      color: var(--accent2);
    }

    .score-bar-wrap {
      width: 80px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      display: inline-block;
      vertical-align: middle;
      margin-left: 8px;
    }

    .score-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    /* ── FULL TABLE ── */
    .full-table-section { margin-top: 32px; }

    .table-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      max-width: 320px;
      padding: 11px 15px;
      border-radius: var(--radius-sm);
      border: 0;
      background: var(--fill);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      letter-spacing: -0.02em;
    }

    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    .table-info { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }

    .full-table-wrap { overflow-x: auto; }

    .full-table { width: 100%; border-collapse: collapse; min-width: 520px; }

    .full-table th {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0 12px 12px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    .full-table th:hover { color: var(--accent); }
    
    .full-table th {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0 12px 12px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    
    .full-table th:first-child,
    .full-table td:first-child {
      text-align: center;
    }
    
    .full-table th:last-child,
    .full-table td:last-child { text-align: center; }

    .full-table td {
      text-align: center;
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    
    .full-table th:nth-child(2), .full-table td:nth-child(2) {
      text-align: left;
    }
    
    .full-table td:last-child {
      text-align: center;
    }

    .full-table tbody tr:hover { background: rgba(49,130,246,0.04); }

    .zero-score { color: var(--muted) !important; }

    .history-btn {
      background: rgba(49,130,246,0.1);
      border: 1px solid rgba(49,130,246,0.3);
      border-radius: 6px;
      color: var(--accent);
      cursor: pointer;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 0.72rem;
      padding: 4px 10px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .history-btn:hover {
      background: rgba(49,130,246,0.2);
      border-color: var(--accent);
    }

    /* ── FINE PAYMENT SECTION ── */
    .fine-table { width: 100%; border-collapse: collapse; }

    .fine-table th {
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0 12px 12px;
      border-bottom: 1px solid var(--border);
    }

    .fine-table td {
      padding: 10px 12px;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .fine-table th:nth-child(2), .fine-table td:nth-child(2) {
      text-align: left;
    }

    .fine-table tbody tr:hover { background: rgba(240,68,82,0.05); }

    .fine-btn {
      background: rgba(240,68,82,0.1);
      border: 1px solid rgba(240,68,82,0.3);
      border-radius: 6px;
      color: var(--danger);
      cursor: pointer;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 0.72rem;
      padding: 4px 10px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .fine-btn:hover {
      background: rgba(240,68,82,0.2);
      border-color: var(--danger);
    }

    .fine-btn-cancel {
      background: rgba(240,68,82,0.2) !important;
      border-color: var(--danger) !important;
    }

    .fine-btn-cancel:hover {
      background: rgba(240,68,82,0.35) !important;
    }

    /* 연속 미참 배지 (벌금 납부 섹션 닉네임 옆 인라인) */
    .miss-badge {
      display: inline-flex;
      align-items: center;
      margin-left: 8px;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      background: rgba(240,68,82,0.15);
      border: 1px solid rgba(240,68,82,0.4);
      color: var(--danger);
      pointer-events: none;
      user-select: none;
      letter-spacing: 0.02em;
      vertical-align: middle;
      white-space: nowrap;
    }
    .miss-badge:disabled { opacity: 1; cursor: default; }

    /* 보약 효과 알림 배너 (메인 페이지 최상단) */
    .guild-alert-banner {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      margin-bottom: 24px;
      background: rgba(251,146,60,0.10);
      border: 1px solid rgba(251,146,60,0.4);
      border-radius: 12px;
    }
    .guild-alert-icon { font-size: 1.6rem; }
    .guild-alert-text { flex: 1; }
    .guild-alert-title {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fb923c;
      margin-bottom: 4px;
    }
    .guild-alert-desc {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .guild-alert-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .alert-btn {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .alert-btn-secondary {
      background: var(--card);
      border-color: var(--border);
      color: var(--muted);
    }
    .alert-btn-secondary:hover { background: var(--border); }
    .alert-btn-primary {
      background: #fb923c;
      border-color: #fb923c;
      color: #1a1f2e;
    }
    .alert-btn-primary:hover { background: #f97316; }




    /* 이월 미해결 라벨 (지난주 미납부 인원) */
    .carryover-badge {
      display: inline-flex;
      align-items: center;
      margin-left: 8px;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      background: rgba(251,146,60,0.15);
      border: 1px solid rgba(251,146,60,0.4);
      color: #fb923c;
      pointer-events: none;
      user-select: none;
      letter-spacing: 0.02em;
      vertical-align: middle;
      white-space: nowrap;
    }
    .carryover-badge:disabled { opacity: 1; cursor: default; }

    /* 작업 컬럼 두 버튼 그룹 */
    .fine-action-group {
      /* 버튼별로 고정 폭 영역을 확보 — 라벨이 '벌금 취소'/'벌금 납부 확인'으로
         바뀌어도 세 버튼의 위치가 행마다 동일하게 유지된다.
         (측정 자연폭: 벌금 납부 확인 88px, 나머지 65px) */
      display: inline-grid;
      grid-template-columns: 96px 74px 74px;
      gap: 6px;
      justify-content: end;
      align-items: center;
    }
    .fine-action-group > button { width: 100%; }

    /* 길드 탈퇴 버튼 */
    .leave-btn {
      background: rgba(156,163,175,0.10);
      border: 1px solid rgba(156,163,175,0.35);
      border-radius: 6px;
      color: #9ca3af;
      cursor: pointer;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 0.72rem;
      padding: 4px 10px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .leave-btn:hover {
      background: rgba(156,163,175,0.22);
      border-color: #9ca3af;
    }

    /* ── MODAL ── */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
    }

    .modal.show { display: flex; }

    .modal-content {
      background: var(--surface);
      border-radius: 22px;
      padding: 28px 26px 22px;
      width: 100%;
      max-width: 400px;
    }

    .modal-header {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      margin-bottom: 14px;
    }

    .modal-body {
      font-size: 0.92rem;
      color: var(--ink-2);
      line-height: 1.65;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .modal-info {
      background: var(--fill);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      font-size: 0.85rem;
      margin-top: 14px;
      color: var(--text);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-btn {
      flex: 1;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 0;
      cursor: pointer;
      letter-spacing: -0.025em;
    }

    .modal-btn.primary { background: var(--accent); color: #fff; }

    .modal-btn.primary:hover { background: #e74747; }

    .modal-btn.secondary { background: var(--fill); color: var(--ink-2); }

    .modal-btn.secondary:hover { background: var(--border); }

    /* ── BRIEFING BOARD ── */
    .brief-banner {
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 14px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    /* .brief-streak 의 margin-top 은 카드 안에서만 필요 — 배너에서는 밑선이 어긋난다 */
    .brief-banner .brief-streak { margin-top: 0; }
    .brief-banner.up   { background: rgba(0,166,97,0.1); border: 1px solid rgba(0,166,97,0.3); color: var(--green); }
    .brief-banner.down { background: rgba(240,68,82,0.1); border: 1px solid rgba(240,68,82,0.3); color: var(--danger); }
    .brief-banner .brief-icon { font-size: 1.3rem; }
    .brief-streak { font-size: 0.8rem; font-weight: 400; opacity: 0.85; margin-left: auto; }
    .brief-group-label {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 14px 0 8px;
    }
    .brief-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .brief-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .brief-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px 22px;
    }
    .brief-card-label {
      font-size: 0.82rem;
      color: var(--ink-2);
      font-weight: 600;
      margin-bottom: 9px;
    }
    .brief-card-value {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
    }
    .brief-change { font-size: 0.78rem; font-weight: 700; margin-bottom: 8px; }
    .brief-change.up   { color: var(--green); }
    .brief-change.down { color: var(--danger); }
    .brief-change.flat { color: var(--muted); }
    .brief-record { font-size: 0.68rem; color: var(--muted); margin-bottom: 4px; }
    .brief-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .brief-bar { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.6s ease; }
    .brief-pct { font-size: 0.65rem; color: var(--muted); margin-top: 3px; text-align: right; }

    @media (max-width: 900px) {
      .brief-grid-3, .brief-grid-4 { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── LOADING ── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 40px 0;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 500;
    }

    .spinner {
      width: 15px; height: 15px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1200px) {
      .leaderboard-row { grid-template-columns: 1fr 1fr; gap: 20px; }
    }

    @media (max-width: 1024px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .main-grid { grid-template-columns: 1fr; }
      .brief-grid-3, .brief-grid-4 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .wrapper { padding: 0 16px 40px; }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .header-right {
        align-items: flex-start;
        width: 100%;
      }
      .stat-grid { grid-template-columns: 1fr; gap: 12px; margin-bottom: 24px; }
      .stat-card { padding: 16px 20px; }
      .stat-label { font-size: 0.65rem; }
      .stat-value { font-size: 1.5rem; }
      .section-title { font-size: 0.9rem; margin-bottom: 12px; }
      .main-grid { grid-template-columns: 1fr; gap: 20px; }
      .chart-wrap { height: 280px; }
      .donut-wrap { height: 280px; }
      .stat-trend-wrap { height: 280px; }
      .brief-grid-3, .brief-grid-4 { grid-template-columns: 1fr; }
      .brief-card { padding: 12px 14px; }
      .search-input { width: 100%; font-size: 0.8rem; padding: 6px 12px; }
      .table-controls { flex-direction: column; gap: 10px; }
      .table-info { margin-left: 0; font-size: 0.7rem; }
      .full-table { font-size: 0.75rem; }
      .full-table th, .full-table td { padding: 8px 10px; }
      /* 벌금 납부 섹션 모바일 대응 */
      .fine-table { font-size: 0.75rem; }
      .fine-table th { font-size: 0.65rem; padding: 0 8px 10px; }
      .fine-table td { padding: 8px 8px; font-size: 0.78rem; }
      .fine-btn { font-size: 0.7rem; padding: 6px 12px; min-height: 32px; }
      .miss-badge { font-size: 0.6rem; padding: 2px 6px; margin-left: 6px; }
      .carryover-badge { font-size: 0.6rem; padding: 2px 6px; margin-left: 6px; }
      .leave-btn { font-size: 0.7rem; padding: 6px 10px; min-height: 32px; }
      .fine-action-group { gap: 5px; }
      /* 보약 효과 알림 배너 모바일 */
      .guild-alert-banner { flex-direction: column; align-items: flex-start; gap: 12px; padding: 14px 16px; }
      .guild-alert-actions { width: 100%; }
      .alert-btn { flex: 1; padding: 9px 12px; font-size: 0.8rem; }
      /* 모달 모바일 대응 */
      .modal-content { padding: 24px 20px; width: 92%; }
      .modal-header { font-size: 1.05rem; margin-bottom: 14px; }
      .modal-body { font-size: 0.85rem; margin-bottom: 16px; }
      .modal-info { font-size: 0.78rem; padding: 10px 12px; }
      .modal-btn { font-size: 0.82rem; padding: 9px 18px; }
      /* 리더보드 모바일 대응 */
      .leaderboard-stack { gap: 16px; }
      .leaderboard-row { grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px; }
    }

    @media (max-width: 480px) {
      body { font-size: 14px; }
      .wrapper { padding: 0 12px 32px; }
      header { margin-bottom: 20px; padding: 20px 0 16px; }
      .header-left h1 { font-size: 1.5rem; }
      .header-left .subtitle { font-size: 0.7rem; }
      .stat-card { padding: 14px 16px; }
      .stat-label { font-size: 0.6rem; }
      .stat-value { font-size: 1.3rem; }
      .stat-value span { font-size: 0.75rem; }
      .card { padding: 16px; border-radius: 8px; }
      .section-title { font-size: 0.8rem; margin-bottom: 12px; }
      .chart-wrap { height: 240px; }
      .donut-wrap { height: 240px; }
      .stat-trend-wrap { height: 240px; }
      .quartile-row { grid-template-columns: 1fr; gap: 8px; }
      .quartile-item { padding: 10px 12px; }
      .analysis-label { font-size: 0.85rem; }
      .analysis-value { font-size: 1.4rem; }
      .analysis-desc { font-size: 0.75rem; }
      .brief-card { padding: 10px 12px; }
      .brief-card-label { font-size: 0.65rem; }
      .brief-card-value { font-size: 1rem; }
      .rank-table th, .rank-table td { padding: 8px 10px; font-size: 0.75rem; }
      .full-table th, .full-table td { padding: 7px 8px; font-size: 0.7rem; }
      .history-btn { font-size: 0.65rem; padding: 3px 8px; }
      /* 벌금 납부 섹션 소형 모바일 대응 */
      .fine-table th { font-size: 0.6rem; padding: 0 6px 8px; letter-spacing: 0.04em; }
      .fine-table td { padding: 7px 6px; font-size: 0.72rem; }
      .fine-btn { font-size: 0.68rem; padding: 7px 10px; min-height: 36px; }
      .miss-badge { font-size: 0.55rem; padding: 2px 5px; margin-left: 4px; }
      .carryover-badge { font-size: 0.55rem; padding: 2px 5px; margin-left: 4px; }
      .leave-btn { font-size: 0.68rem; padding: 7px 10px; min-height: 36px; width: 100%; }
      .fine-action-group { grid-template-columns: 1fr; gap: 5px; }
      .guild-alert-banner { padding: 12px 14px; }
      .guild-alert-icon { font-size: 1.4rem; }
      .guild-alert-title { font-size: 0.88rem; }
      .guild-alert-desc { font-size: 0.72rem; }
      .alert-btn { padding: 9px 10px; font-size: 0.75rem; min-height: 38px; }
      /* 모달 소형 모바일 대응 */
      .modal-content { padding: 20px 16px; width: 94%; border-radius: 10px; }
      .modal-header { font-size: 1rem; margin-bottom: 12px; }
      .modal-body { font-size: 0.82rem; margin-bottom: 14px; line-height: 1.55; }
      .modal-info { font-size: 0.75rem; padding: 9px 10px; margin-bottom: 14px; }
      .modal-actions { gap: 8px; }
      .modal-btn { font-size: 0.8rem; padding: 10px 14px; flex: 1; min-height: 40px; }
      /* 리더보드 소형 모바일 대응 */
      .leaderboard-stack { gap: 12px; }
      .leaderboard-row { gap: 12px; margin-bottom: 16px; }
    }
    /* 리더보드 — 메인 페이지와 동일한 스타일 */
    .lb-list { margin-top: -4px; }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 0;
    }
    .lb-row + .lb-row { border-top: 1px solid var(--line); }
    .lb-medal {
      width: 22px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .lb-row.rank-1 .lb-medal,
    .lb-row.rank-2 .lb-medal,
    .lb-row.rank-3 .lb-medal { color: var(--accent); }
    .lb-meta { flex: 1; min-width: 0; }
    .lb-name {
      font-size: 0.94rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lb-job { font-size: 0.76rem; color: var(--muted); margin-top: 2px; font-weight: 500; }
    .lb-value {
      font-size: 0.94rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }
    .lb-value-sub {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2px;
    }
    .lb-value.fine { color: var(--danger); }
    .lb-value.rise { color: var(--up); }
    .lb-value.drop { color: var(--danger); }
    /* 리더보드 행 — 클릭하면 히스토리로 이동 */
    .lb-row[data-name] { cursor: pointer; }
    .lb-row[data-name]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .lb-empty {
      font-size: 0.88rem;
      color: var(--muted);
      padding: 26px 0;
      text-align: center;
      font-weight: 500;
    }
    /* ── 모션 ───────────────────────────────
       장식이 아니라 피드백. 진입할 때 한 번 떠오르고, 조작에는 즉시 반응한다.
       거리는 짧게(10px), 시간은 짧게(0.4s 이내). */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    .brief-banner,
    .stat-grid > .stat-card,
    .brief-grid-3 > .brief-card,
    .brief-grid-4 > .brief-card,
    .wrapper > .card,
    .wrapper > .full-table-section,
    .leaderboard-row-public > .card {
      animation: riseIn 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    /* 순차 등장 — 같은 줄의 카드들이 왼쪽부터 차례로 */
    .stat-grid > .stat-card:nth-child(2),
    .brief-grid-3 > .brief-card:nth-child(2),
    .brief-grid-4 > .brief-card:nth-child(2),
    .leaderboard-row-public > .card:nth-child(2) { animation-delay: 0.06s; }
    .stat-grid > .stat-card:nth-child(3),
    .brief-grid-3 > .brief-card:nth-child(3),
    .brief-grid-4 > .brief-card:nth-child(3) { animation-delay: 0.12s; }
    .brief-grid-4 > .brief-card:nth-child(4) { animation-delay: 0.18s; }

    /* 행 hover — 어디를 보고 있는지 알려준다 */
    .top5-row, .lb-row { transition: background 0.15s; }
    .top5-row:hover, .lb-row:hover { background: var(--fill-2); }

    /* 누름 반응 */
    button, .admin-link-btn { transition: background 0.15s, border-color 0.15s, transform 0.08s; }
    button:active, .admin-link-btn:active { transform: scale(0.97); }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.4s; }
      * { transition: none !important; }
      .brief-banner, .stat-card, .brief-card, .card, .full-table-section { animation: none !important; }
    }
  
    /* ── 무기 마크 (제네시스/데스티니 착용자) ── */
    .wmark {
      display: inline-block;
      vertical-align: middle;
      margin-left: 6px;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      white-space: nowrap;
      line-height: 1.45;
      position: relative;
      overflow: hidden;
    }
    /* 제네시스 — 검은 바탕, 빨간 글씨, 번쩍이는 발광 */
    .wmark-genesis {
      background: #0a0a0f;
      color: #ff3b3b;
      border: 1px solid #5c0d0d;
      text-shadow: 0 0 5px rgba(255,59,59,0.9);
      animation: wmarkGenesis 1.3s ease-in-out infinite;
    }
    @keyframes wmarkGenesis {
      0%, 100% { box-shadow: 0 0 3px rgba(255,59,59,0.35); color: #ff3b3b;
                 text-shadow: 0 0 4px rgba(255,59,59,0.7); }
      50%      { box-shadow: 0 0 11px 2px rgba(255,59,59,0.85); color: #ff7a7a;
                 text-shadow: 0 0 9px rgba(255,90,90,1); }
    }
    /* 데스티니 — 하늘색 바탕, 노란 글씨, 반짝이는 광택 스윕 */
    /* 데스티니 — 실제 무기 색감(아이보리골드 바디 · 시안 보석 · 바이올렛 오라) */
    .wmark-destiny {
      background: linear-gradient(135deg, #1f5f9e 0%, #37a6cf 45%, #8f7be0 100%);
      color: #ffe6a3;
      border: 1px solid rgba(160,224,255,0.75);
      text-shadow: 0 0 6px rgba(255,205,110,0.95), 0 1px 1px rgba(0,0,0,0.45);
      animation: wmarkDestinyGlow 2.4s ease-in-out infinite;
    }
    @keyframes wmarkDestinyGlow {
      0%, 100% { box-shadow: 0 0 6px rgba(120,205,255,0.40), inset 0 0 6px rgba(175,150,255,0.30); }
      50%      { box-shadow: 0 0 12px 2px rgba(150,225,255,0.75), inset 0 0 8px rgba(200,175,255,0.50); }
    }
    /* 골드빛 광택 스윕 — 금속에 빛이 스치듯 */
    .wmark-destiny::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 32%, rgba(255,248,220,0.85) 50%, transparent 68%);
      transform: translateX(-120%);
      animation: wmarkShimmer 2.4s ease-in-out infinite;
    }
    @keyframes wmarkShimmer { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(120%); } }
    @media (prefers-reduced-motion: reduce) {
      .wmark-genesis { animation: none; box-shadow: 0 0 6px rgba(255,59,59,0.6); }
      .wmark-destiny { animation: none; box-shadow: 0 0 7px rgba(140,215,255,0.6); }
      .wmark-destiny::after { animation: none; opacity: 0; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <h1>나비 길드</h1>
      <div class="subtitle">MAPLESTORY · 오로라 서버 · 지하수로 대시보드</div>
    </div>
    <div class="header-right">
      <div class="updated-at" id="updatedAt">불러오는 중...</div>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </header>

  <!-- 페이지 탭 -->
  <nav class="page-tabs">
    <a href="/admin" class="page-tab active">개요</a>
    <a href="/manage" class="page-tab">관리</a>
  </nav>

  <!-- 보약 효과 알림 배너 (조건부) -->
  <div id="guildAlertBanner" class="guild-alert-banner" style="display:none;">
    <div class="guild-alert-text">
      <div class="guild-alert-title">이번 주 길드원 <strong id="guildAlertCount">0</strong>명이 전주 대비 점수 감소</div>
      <div class="guild-alert-desc">혹시 보약 효과가 종료되었나요? 확인 시 이번 주 이후 데이터를 새 기준선으로 적용합니다.</div>
    </div>
    <div class="guild-alert-actions">
      <button class="alert-btn alert-btn-secondary" onclick="dismissGuildAlert()">무시</button>
      <button class="alert-btn alert-btn-primary" onclick="showGuildBaselineModal()">네, 확인</button>
    </div>
  </div>

  <!-- STAT CARDS -->
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label" id="labelTotal">총 길드원</div>
      <div class="stat-value" id="statTotal">—<span>명</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label" id="labelActive">수로 참여자</div>
      <div class="stat-value" id="statActive">—<span>명</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label" id="labelScore">수로 총 점수</div>
      <div class="stat-value" id="statTotalScore">—</div>
    </div>
  </div>

  <!-- 브리핑 보드 -->
  <div id="briefingBoard" style="margin-bottom:32px;"></div>

  <!-- 주간 총점수 추이 -->
  <div class="card" style="margin-bottom:32px;">
    <div class="section-title">주간 길드 총점수 추이</div>
    <div class="chart-wrap">
      <canvas id="historyChart"></canvas>
    </div>
  </div>

  <!-- 점수 분포 차트 -->
  <div class="card" style="margin-bottom:32px;">
    <div class="section-title" style="display:flex;align-items:center;gap:10px;">
      점수 분포 (구간별 인원)
      <span id="distWeekBadge" style="font-size:0.72rem;color:var(--muted);font-family:'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;font-weight:400;"></span>
    </div>
    <div class="chart-wrap">
      <canvas id="distChart"></canvas>
    </div>
  </div>

  <!-- 통계 분석 + 주간 통계 추이 (전체 너비) -->
  <div class="card" style="margin-bottom:32px;">
    <div class="section-title">길드원 점수 통계 분석</div>
    <div id="statsAnalysisWrap"><div class="loading"><div class="spinner"></div> 불러오는 중</div></div>
    <hr class="analysis-divider">
    <div class="section-title" style="font-size:0.85rem;margin-bottom:10px;">주간 통계 추이</div>
    <div class="stat-trend-wrap">
      <canvas id="statTrendChart"></canvas>
    </div>
  </div>


</div>

<!-- MODALS -->
<div class="modal" id="fineConfirmModal">
  <div class="modal-content">
    <div class="modal-header">벌금 납부 확인</div>
    <div class="modal-body">
      <div id="fineConfirmText"></div>
      <div class="modal-info" id="fineAmountInfo"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeFineModal()">취소</button>
      <button class="modal-btn primary" onclick="confirmFinePayment()">확인</button>
    </div>
  </div>
</div>

<div class="modal" id="fineUndoModal">
  <div class="modal-content">
    <div class="modal-header">벌금 납부 취소</div>
    <div class="modal-body">
      <div id="fineUndoText"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeFineModal()">취소</button>
      <button class="modal-btn primary" onclick="confirmUndoFine()">취소 완료</button>
    </div>
  </div>
</div>

<script>
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// ── 인증 가드: 비로그인 시 로그인 페이지로 ──
(async function authGuard() {
  try {
    const res = await fetch('/api/auth-status');
    const data = await res.json();
    if (!data.is_admin) { location.replace('/login'); }
  } catch (e) { location.replace('/login'); }
})();

async function doLogout() {
  try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
  location.href = '/';
}

const JOB_COLORS = [
  '#3182F6','#FFB020','#8B95A1','#00A661','#F04452',
  '#fb923c','#38bdf8','#e879f9','#FFB020','#34d399',
  '#60a5fa','#f472b6','#a3e635','#fb7185','#c084fc',
  '#22d3ee','#fbbf24','#86efac','#818cf8','#f9a8d4',
];

let allMembers = [];
let filteredMembers = [];
let jobChart = null;
let distChart = null;
let historyChart = null;
let statTrendChart = null;
let zeroScoreMembers = [];
let currentFineData = null;
let currentWeek = '';

async function fetchData() {
  const res = await fetch('/api/data');
  return res.json();
}

function fmt(n) {
  return Number(n).toLocaleString('ko-KR');
}

function weaponMark(tier) {
  if (tier === 'genesis') return ' <span class="wmark wmark-genesis">대적자: 제네시스 해방</span>';
  if (tier === 'destiny') return ' <span class="wmark wmark-destiny">대적자: 데스티니 초월</span>';
  return '';
}

/* 큰 수치를 현재 표시값 → 목표값으로 굴려서 채운다.
   첫 진입은 0 부터, 갱신 시에는 이전 값부터 이어져 깜빡이지 않는다. */
function countUp(el, to, suffix = '') {
  if (!el) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const from = Number(String(el.textContent).replace(/[^\d]/g, '')) || 0;
  // 배경 탭이면 rAF 가 멈춰 값이 갱신되지 않으므로 곧바로 최종값을 쓴다
  if (reduce || from === to || document.hidden) { el.innerHTML = fmt(to) + suffix; return; }

  const DURATION = 800;
  const t0 = performance.now();
  let done = false;
  const tick = (now) => {
    const p = Math.min((now - t0) / DURATION, 1);
    const eased = 1 - Math.pow(1 - p, 3);          // easeOutCubic
    el.innerHTML = fmt(Math.round(from + (to - from) * eased)) + suffix;
    if (p < 1) requestAnimationFrame(tick); else done = true;
  };
  requestAnimationFrame(tick);
  // rAF 가 도중에 멈춰도(탭 전환 등) 최종값은 반드시 표시되도록 보정
  setTimeout(() => { if (!done) el.innerHTML = fmt(to) + suffix; }, DURATION + 400);
}

const JOB_NAME_MAP = {
  '아크메이지(불, 독)': '아크메이지(불, 독)',
  '아크메이지(불)': '아크메이지(불, 독)',
  '아크메이지(썬, 콜)': '아크메이지(썬, 콜)',
  '아크메이지(썬)': '아크메이지(썬, 콜)',
  '아크메이지 (불, 독)': '아크메이지(불, 독)',
  '아크메이지 (썬, 콜)': '아크메이지(썬, 콜)',
};

function normalizeJob(job) {
  return JOB_NAME_MAP[job] ?? job;
}

function normalizeMembers(members) {
  return members.map(m => ({ ...m, job: normalizeJob(m.job) }));
}

function renderStats(stats) {
  countUp(document.getElementById('statTotal'), stats.total, '<span>명</span>');
  countUp(document.getElementById('statActive'), stats.active, '<span>명</span>');
  countUp(document.getElementById('statTotalScore'), stats.total_score);
  document.getElementById('updatedAt').textContent = `업데이트: ${stats.updated_at}`;
}

function calcAnalysis(members) {
  const scores = members.map(m => m.score).filter(s => s > 0).sort((a, b) => a - b);
  const n = scores.length;
  if (!n) return null;
  const mean = scores.reduce((a, b) => a + b, 0) / n;
  const stddev = Math.sqrt(scores.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
  const q = p => {
    const idx = p * (n - 1);
    const lo = Math.floor(idx), hi = Math.ceil(idx);
    return Math.round(scores[lo] + (scores[hi] - scores[lo]) * (idx - lo));
  };
  return { mean: Math.round(mean), stddev: Math.round(stddev), q1: q(0.25), q2: q(0.5), q3: q(0.75) };
}

function renderAnalysis(members) {
  const r = calcAnalysis(members);
  if (!r) { document.getElementById('statsAnalysisWrap').innerHTML = '<p style="color:var(--muted)">데이터 없음</p>'; return; }
  document.getElementById('statsAnalysisWrap').innerHTML = `
    <div class="analysis-block">
      <div class="analysis-label">평균 점수</div>
      <div class="analysis-value">${fmt(r.mean)}</div>
    </div>
    <hr class="analysis-divider">
    <div class="analysis-block">
      <div class="analysis-label">표준편차</div>
      <div class="analysis-value">${fmt(r.stddev)}</div>
    </div>
    <hr class="analysis-divider">
    <div class="analysis-block">
      <div class="analysis-label">사분위 구간</div>
      <div class="quartile-row">
        <div class="quartile-item">
          <div class="quartile-tag">Q1 · 하위 25%</div>
          <div class="quartile-val">${fmt(r.q1)}</div>
        </div>
        <div class="quartile-item">
          <div class="quartile-tag">Q2 · 중간값</div>
          <div class="quartile-val">${fmt(r.q2)}</div>
        </div>
        <div class="quartile-item">
          <div class="quartile-tag">Q3 · 상위 25%</div>
          <div class="quartile-val">${fmt(r.q3)}</div>
        </div>
      </div>
    </div>`;
}

function renderJobChart(dist) {
  const labels = dist.map(d => d.job);
  const data   = dist.map(d => d.count);
  const colors = dist.map((_, i) => JOB_COLORS[i % JOB_COLORS.length]);

  if (jobChart) jobChart.destroy();
  jobChart = new Chart(document.getElementById('jobChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
    options: {
      cutout: '68%',
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed}명` }
      }},
      animation: { animateRotate: true, duration: 800 }
    }
  });

  const PAGE_SIZE = 10;
  let legendPage = 0;
  const totalPages = Math.ceil(dist.length / PAGE_SIZE);

  function renderLegendPage() {
    const start = legendPage * PAGE_SIZE;
    const items = dist.slice(start, start + PAGE_SIZE);
    document.getElementById('jobLegend').innerHTML = items.map((d, i) => `
      <div class="legend-item">
        <span class="legend-dot" style="background:${colors[start + i]}"></span>
        <span class="legend-name">${d.job}</span>
        <span class="legend-count">${d.count}명</span>
      </div>`).join('');
    document.getElementById('legendPage').textContent = `${legendPage + 1} / ${totalPages}`;
    document.getElementById('legendPrev').disabled = legendPage === 0;
    document.getElementById('legendNext').disabled = legendPage === totalPages - 1;
  }

  document.getElementById('legendPrev').onclick = () => { if (legendPage > 0) { legendPage--; renderLegendPage(); } };
  document.getElementById('legendNext').onclick = () => { if (legendPage < totalPages - 1) { legendPage++; renderLegendPage(); } };

  renderLegendPage();
}

function renderDistChart(members) {
  const active = members.filter(m => m.score > 0).map(m => m.score);
  const STEP = 10000;
  const maxScore = active.length ? Math.max(...active) : STEP;
  const topBracket = Math.ceil(maxScore / STEP) * STEP;

  const brackets = [{ label: '0점', count: members.filter(m => m.score === 0).length }];
  for (let lo = 0; lo < topBracket; lo += STEP) {
    const hi = lo + STEP;
    const label = lo === 0 ? `~1만` : `${lo / 10000}만~${hi / 10000}만`;
    brackets.push({ label, count: active.filter(s => s > lo && s <= hi).length });
  }

  if (distChart) distChart.destroy();
  distChart = new Chart(document.getElementById('distChart'), {
    type: 'bar',
    data: {
      labels: brackets.map(b => b.label),
      datasets: [{
        label: '인원 수',
        data: brackets.map(b => b.count),
        backgroundColor: 'rgba(49,130,246,0.6)',
        borderColor: '#3182F6',
        borderWidth: 1,
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ` ${ctx.parsed.y}명` }
      }},
      scales: {
        x: { grid: { color: cssVar('--border') }, ticks: { color: cssVar('--muted') } },
        y: { grid: { color: cssVar('--border') }, ticks: { color: cssVar('--muted'), stepSize: 1 } }
      }
    }
  });
}

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

function renderFullTable(members) {
  const tbody = document.getElementById('fullTbody');
  tbody.innerHTML = members.map(m => `<tr>
    <td  style="color:var(--muted);font-size:0.8rem">${m.rank}</td>
    <td>${m.name}${weaponMark(m.weapon_tier)}</td>
    <td><span class="rank-job">${m.job}</span></td>
    <td class="${m.score === 0 ? 'zero-score' : ''}"  style="font-weight:800">
      ${m.score === 0 ? '—' : fmt(m.score)}
    </td>
    <td >
      <button type="button" class="history-btn" data-name="${escapeAttr(m.name)}">히스토리</button>
    </td>
  </tr>`).join('');
  document.getElementById('tableInfo').textContent = `${members.length}명 표시 중`;
}

function filterTable(query) {
  const q = query.trim().toLowerCase();
  filteredMembers = q
    ? allMembers.filter(m => m.name.toLowerCase().includes(q) || m.job.toLowerCase().includes(q))
    : [...allMembers];
  renderFullTable(filteredMembers);
}

function weekLabel(w) {
  return `${w.slice(0,4)}-${w.slice(4,6)}-${w.slice(6,8)}`;
}

function setStatLabels(week) {
  const prefix = week ? `(${weekRangeLabel(week)}) ` : '';
  document.getElementById('labelTotal').textContent  = `${prefix}총 길드원`;
  document.getElementById('labelActive').textContent = `${prefix}수로 참여자`;
  document.getElementById('labelScore').textContent  = `${prefix}수로 총 점수`;
}

function setWeekBadge(week) {
  const badge = week ? `— ${weekLabel(week)}` : '';
  document.getElementById('distWeekBadge').textContent = badge;
  document.getElementById('tableWeekBadge').textContent = badge;
}

async function loadWeekData(week) {
  const res = await fetch(`/api/week/${week}`);
  if (!res.ok) return;
  const data = await res.json();
  const members = normalizeMembers(data.all_members);
  allMembers = members;
  filteredMembers = [...members];
  setWeekBadge(week);
  setStatLabels(week);

  const scores = members.map(m => m.score).filter(s => s > 0);
  renderStats({
    total: members.length,
    active: scores.length,
    total_score: scores.reduce((a, b) => a + b, 0),
    updated_at: weekLabel(week),
  });

  renderAnalysis(members);
  renderDistChart(members);
  renderFullTable(members);
  document.getElementById('searchInput').value = '';
}

function weekRangeLabel(w) {
  const end = new Date(`${w.slice(0,4)}-${w.slice(4,6)}-${w.slice(6,8)}`);
  const start = new Date(end);
  start.setDate(end.getDate() - 6);
  const f = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${f(start)}~${f(end)}`;
}

function renderStatTrendChart(history) {
  const labels = history.map(h => weekRangeLabel(h.week));
  const mk = (label, data, color, dash) => ({
    label, data,
    borderColor: color,
    backgroundColor: 'transparent',
    borderWidth: 2,
    borderDash: dash || [],
    pointRadius: 3,
    pointHoverRadius: 6,
    tension: 0.3,
  });

  if (statTrendChart) statTrendChart.destroy();
  statTrendChart = new Chart(document.getElementById('statTrendChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        mk('Q3 (상위 25%)',  history.map(h => h.q3),           '#8B95A1'),
        mk('평균',           history.map(h => h.mean),          '#00A661'),
        mk('중간값 (Q2)',    history.map(h => h.median_score),  '#3182F6'),
        mk('Q1 (하위 25%)', history.map(h => h.q1),            '#F04452', [4,3]),
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#8899bb', font: { size: 12 }, boxWidth: 24 } },
        tooltip: {
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` }
        }
      },
      scales: {
        x: { grid: { color: cssVar('--border') }, ticks: { color: cssVar('--muted') } },
        y: { grid: { color: cssVar('--border') }, ticks: { color: cssVar('--muted'), callback: v => fmt(v) } }
      }
    }
  });
}

function renderBriefing(history) {
  const el = document.getElementById('briefingBoard');
  if (history.length < 2) { el.innerHTML = ''; return; }

  const cur  = history[history.length - 1];
  const prev = history[history.length - 2];

  const atHigh = k => Math.max(...history.map(h => h[k]));
  const atLow  = k => Math.min(...history.filter(h => h[k] > 0).map(h => h[k]));

  // 연속 성장/하락 주수
  const isUp = cur.total_score >= prev.total_score;
  let streak = 1;
  for (let i = history.length - 2; i > 0; i--) {
    const up = history[i].total_score >= history[i-1].total_score;
    if (up === isUp) streak++; else break;
  }

  function chg(c, p, unit='', reversed=false) {
    const diff = c - p;
    const pct  = p > 0 ? ((diff / p) * 100).toFixed(1) : '0.0';
    const good = reversed ? diff <= 0 : diff >= 0;
    const cls  = diff === 0 ? 'flat' : good ? 'up' : 'down';
    const arr  = diff > 0 ? '▲' : diff < 0 ? '▼' : '━';
    const sign = diff > 0 ? '+' : '';
    return `<div class="brief-change ${cls}">${arr} ${sign}${fmt(Math.abs(diff))}${unit} (${sign}${pct}%)</div>`;
  }

  function bar(c, best, reversed=false) {
    const pct = best > 0 ? Math.min(100, Math.round((reversed ? best/c : c/best)*100)) : 0;
    const lbl = reversed ? `역대 최저: ${fmt(best)}` : `역대 최고: ${fmt(best)}`;
    const ref = reversed ? '최저 대비' : '최고 대비';
    return `<div class="brief-record">${lbl}</div>
            <div class="brief-bar-wrap"><div class="brief-bar" style="width:${pct}%"></div></div>
            <div class="brief-pct">${ref} ${pct}%</div>`;
  }

  function card(label, c, p, best, unit='', reversed=false) {
    return `<div class="brief-card">
      <div class="brief-card-label">${label}</div>
      <div class="brief-card-value">${fmt(c)}${unit}</div>
      ${chg(c, p, unit, reversed)}
      ${bar(c, best, reversed)}
    </div>`;
  }

  el.innerHTML = `
    <div class="brief-banner ${isUp ? 'up' : 'down'}">
      <span class="brief-icon">${isUp ? '↑' : '↓'}</span>
      <span>이번 주 길드는 지난 주보다 ${isUp ? '성장했습니다' : '하향됐습니다'}</span>
      <span class="brief-streak">${streak}주 연속 ${isUp ? '성장' : '하락'} 중</span>
    </div>
    <div class="brief-group-label">주요 지표</div>
    <div class="brief-grid-3">
      ${card('길드 총 점수',   cur.total_score,   prev.total_score,   atHigh('total_score'))}
      ${card('이번 주 참여자', cur.active,         prev.active,         atHigh('active'), '명')}
      ${card('평균 점수',      cur.mean,           prev.mean,           atHigh('mean'))}
    </div>
    <div class="brief-group-label">분포 지표</div>
    <div class="brief-grid-4">
      ${card('Q1 · 하위 25%', cur.q1,           prev.q1,           atHigh('q1'))}
      ${card('Q2 · 중간값',   cur.median_score, prev.median_score, atHigh('median_score'))}
      ${card('Q3 · 상위 25%', cur.q3,           prev.q3,           atHigh('q3'))}
      ${card('표준편차',       cur.stddev,        prev.stddev,        atLow('stddev'), '', true)}
    </div>`;
}

function renderHistoryChart(history) {
  const labels  = history.map(h => weekRangeLabel(h.week));
  const totals  = history.map(h => h.total_score);
  const medians = history.map(h => h.median_score);
  const actives = history.map(h => h.active);

  if (historyChart) historyChart.destroy();
  historyChart = new Chart(document.getElementById('historyChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '길드 총점수',
        data: totals,
        borderColor: '#3182F6',
        backgroundColor: 'rgba(49,130,246,0.12)',
        borderWidth: 2,
        pointRadius: 6,
        pointHoverRadius: 10,
        pointHitRadius: 24,
        fill: true,
        tension: 0.3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      onHover: (e, elements) => {
        e.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      },
      onClick: (_, elements) => {
        if (!elements.length) return;
        const week = history[elements[0].index].week;
        loadWeekData(week);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: ctx => weekLabel(history[ctx[0].dataIndex].week),
            afterBody: ctx => {
              const i = ctx[0].dataIndex;
              return [`중간값: ${fmt(medians[i])}`, `참여인원: ${actives[i]}명`];
            },
            label: ctx => ` 총점수: ${fmt(ctx.parsed.y)}`,
          }
        }
      },
      scales: {
        x: { grid: { color: cssVar('--border') }, ticks: { color: cssVar('--muted') } },
        y: { grid: { color: cssVar('--border') }, ticks: { color: cssVar('--muted'), callback: v => fmt(v) } }
      }
    }
  });
}

async function fetchZeroScoreMembers(week) {
  const res = await fetch(`/api/zero-score/${week}`);
  if (!res.ok) return [];
  const data = await res.json();
  return data.members || [];
}

function renderFineTable(members, week) {
  const tbody = document.getElementById('fineTbody');
  tbody.innerHTML = members.map(m => {
    const isAlreadyFined = m.last_fine_week === week;
    const btnText = isAlreadyFined ? '벌금 취소' : '벌금 납부 확인';
    const btnClass = isAlreadyFined ? 'fine-btn fine-btn-cancel' : 'fine-btn';

    // 연속 미참 배지
    const cm = m.consecutive_misses || 0;
    const missBadge = cm >= 2
      ? `<button type="button" class="miss-badge" disabled aria-disabled="true">${cm}주 연속 미참</button>`
      : '';

    // 지난주 미납부 라벨 — 이월 또는 미해결 2건 이상
    const pendingCount = m.pending_count || 0;
    const isCarryover = m.is_carryover === true;
    const showCarryover = isCarryover || pendingCount >= 2;
    const carryoverBadge = showCarryover
      ? `<button type="button" class="carryover-badge" disabled aria-disabled="true">지난주 미납부 인원</button>`
      : '';

    return `<tr>
      <td  style="color:var(--muted);font-size:0.8rem">${m.rank}</td>
      <td>${m.name}${carryoverBadge}${missBadge}</td>
      <td><span class="rank-job">${m.job}</span></td>
      <td  style="font-weight:800">${m.fine_count}</td>
      <td >
        <div class="fine-action-group">
          <button type="button" class="${btnClass}" data-name="${escapeAttr(m.name)}" data-rank="${m.rank}" data-fine-count="${m.fine_count}" data-pending-count="${pendingCount}" data-is-fined="${isAlreadyFined}">${btnText}</button>
          <button type="button" class="leave-btn" data-name="${escapeAttr(m.name)}">길드 탈퇴</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  const section = document.getElementById('fineSection');
  if (members.length === 0) {
    section.style.display = 'none';
  } else {
    section.style.display = 'block';
    document.getElementById('fineWeekBadge').textContent = `— ${weekLabel(week)}`;
  }
}

function showFineConfirmModal(name, rank, fineCount, pendingCount, week) {
  currentFineData = { name, rank, fineCount, pendingCount, week };
  const currentCount = parseInt(fineCount) || 0;
  const processCount = Math.max(parseInt(pendingCount) || 0, 1);
  const newCount = currentCount + processCount;

  // 누진 산식 합산: amount(N회차) = 10 + (N - 1)
  let totalAmount = 0;
  for (let fc = currentCount + 1; fc <= newCount; fc++) {
    totalAmount += 10 + (fc - 1);
  }

  const batchLine = processCount > 1
    ? `<br><span style="color:#fb923c;font-weight:700;">미해결 ${processCount}건 일괄 처리</span>`
    : '';

  document.getElementById('fineConfirmText').innerHTML = `
    <strong>${name}</strong> 길드원의 벌금을 확인하시겠습니까?${batchLine}<br><br>
    현재 누적 횟수: <strong>${currentCount}</strong>회<br>
    부과 건수: <strong>${processCount}</strong>건<br>
    총 벌금: 솔 에르다 조각 <strong>${fmt(totalAmount)}</strong> 개
  `;
  document.getElementById('fineAmountInfo').innerHTML = `
    부과 후 누적 횟수: <strong>${newCount}</strong>회
  `;
  document.getElementById('fineConfirmModal').classList.add('show');
}

function closeFineModal() {
  document.getElementById('fineConfirmModal').classList.remove('show');
  document.getElementById('fineUndoModal').classList.remove('show');
  currentFineData = null;
}

let currentLeaveData = null;

function showLeaveGuildModal(name) {
  currentLeaveData = { name };
  document.getElementById('leaveGuildText').innerHTML = `
    <strong>${name}</strong> 길드원을 길드 탈퇴 처리하시겠습니까?<br><br>
    이후 벌금 납부 목록에 다시 표시되지 않습니다.
  `;
  document.getElementById('leaveGuildModal').classList.add('show');
}

function closeLeaveGuildModal() {
  document.getElementById('leaveGuildModal').classList.remove('show');
  currentLeaveData = null;
}

async function confirmLeaveGuild() {
  if (!currentLeaveData) return;
  const { name } = currentLeaveData;
  try {
    const res = await fetch(`/api/leave-guild/${encodeURIComponent(name)}`, { method: 'POST' });
    if (!res.ok) {
      const err = await res.json();
      alert(`오류: ${err.detail || '요청이 실패했습니다.'}`);
      return;
    }
    closeLeaveGuildModal();
    alert(`${name} 회원이 길드 탈퇴 처리되었습니다.`);
    await init();
  } catch (e) {
    alert('통신 오류가 발생했습니다.');
  }
}

async function confirmFinePayment() {
  if (!currentFineData) return;
  const { name, week } = currentFineData;
  
  try {
    const res = await fetch(`/api/fine/${week}/${encodeURIComponent(name)}`, { method: 'POST' });
    if (!res.ok) {
      const err = await res.json();
      alert(`오류: ${err.detail || '요청이 실패했습니다.'}`);
      return;
    }
    const result = await res.json();
    
    closeFineModal();
    alert('벌금이 부과되었습니다.');
    await init();
  } catch (e) {
    alert('통신 오류가 발생했습니다.');
  }
}

function showFineUndoModal(name, fineCount, amount, week, isPreExisting = false) {
  currentFineData = { name, fineCount, amount, week };
  
  if (isPreExisting) {
    const currentAmount = 10 + (fineCount - 1);
    document.getElementById('fineUndoText').innerHTML = `
      <strong>${name}</strong> 길드원의 벌금을 취소하시겠습니까?<br><br>
      현재 부과 벌금: 솔 에르다 조각 <strong>${fmt(currentAmount)}</strong>개<br>
      누적 납부 횟수: <strong>${fineCount}</strong>회<br><br>
      같은 주차 내에서만 취소 가능합니다.
    `;
  } else {
    document.getElementById('fineUndoText').innerHTML = `
      <strong>${name}</strong> 길드원의 벌금 납부가 확인되었습니다.<br><br>
      현재 부과 벌금: 솔 에르다 조각 <strong>${fmt(amount)}</strong>개<br>
      누적 납부 횟수: <strong>${fineCount}</strong>회<br><br>
      취소하시려면 아래 버튼을 클릭하세요. (같은 주차 내에서만 취소 가능)
    `;
  }
  document.getElementById('fineUndoModal').classList.add('show');
}

async function confirmUndoFine() {
  if (!currentFineData) return;
  const { name, week } = currentFineData;
  
  try {
    const res = await fetch(`/api/fine/${week}/${encodeURIComponent(name)}`, { method: 'DELETE' });
    if (!res.ok) {
      const err = await res.json();
      alert(`오류: ${err.detail || '요청이 실패했습니다.'}`);
      return;
    }
    
    closeFineModal();
    alert('벌금 납부가 취소되었습니다.');
    await init();
  } catch (e) {
    alert('통신 오류가 발생했습니다.');
  }
}

const MEDALS = ['1', '2', '3', '4', '5'];

async function fetchAndRenderLeaderboards() {
  const elAvg  = document.getElementById('lbAvgRank');
  const elFine = document.getElementById('lbFine');
  const elRise = document.getElementById('lbRise');
  const elDrop = document.getElementById('lbDrop');
  try {
    const res = await fetch('/api/leaderboards');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (elAvg)  elAvg.innerHTML  = renderAvgRankList(data.avg_rank_top3 || []);
    if (elFine) elFine.innerHTML = renderFineList(data.fine_top3 || []);
    if (elRise) elRise.innerHTML = renderDeltaList(data.rise_top5 || [], 'rise');
    if (elDrop) elDrop.innerHTML = renderDeltaList(data.drop_top5 || [], 'drop');
    renderGuildAlert(data.guild_alert || null);
  } catch (e) {
    if (elAvg)  elAvg.innerHTML  = '<div class="lb-empty">불러오기 실패</div>';
    if (elFine) elFine.innerHTML = '<div class="lb-empty">불러오기 실패</div>';
    if (elRise) elRise.innerHTML = '<div class="lb-empty">불러오기 실패</div>';
    if (elDrop) elDrop.innerHTML = '<div class="lb-empty">불러오기 실패</div>';
  }
}


function renderGuildAlert(alert) {
  const banner = document.getElementById('guildAlertBanner');
  if (!banner) return;  // 페이지에 알림 배너 없으면 무시
  if (!alert) {
    banner.style.display = 'none';
    return;
  }
  document.getElementById('guildAlertCount').textContent = alert.drop_count;
  banner.dataset.currentWeek = alert.current_week;
  banner.style.display = 'flex';
}

// 스펙 다운 확인 모달

// 보약 효과 종료 확인 모달
function showGuildBaselineModal() {
  const banner = document.getElementById('guildAlertBanner');
  const wk = banner.dataset.currentWeek;
  const count = document.getElementById('guildAlertCount').textContent;
  document.getElementById('guildBaselineText').innerHTML = `
    이번 주차(<strong>${weekLabel(wk)}</strong>)에 ${count}명이 전주 대비 점수 감소했습니다.<br><br>
    보약 효과 종료로 인정하시겠습니까?<br><br>
    <span style="color:var(--muted);font-size:0.85rem;">
      이번 주차 이후 데이터를 길드 전체의 새 기준선으로 적용합니다.<br>
      모든 회원의 점수 평균이 이 주차 이후 데이터로 재산출됩니다.
    </span>
  `;
  document.getElementById('guildBaselineModal').classList.add('show');
}
function closeGuildBaselineModal() {
  document.getElementById('guildBaselineModal').classList.remove('show');
}
async function confirmGuildBaseline() {
  try {
    const res = await fetch('/api/guild-baseline', { method: 'POST' });
    if (!res.ok) {
      const err = await res.json();
      alert(`오류: ${err.detail || '요청이 실패했습니다.'}`);
      return;
    }
    closeGuildBaselineModal();
    alert('보약 효과 종료 처리되었습니다. 평균이 재산출됩니다.');
    await init();
  } catch (e) {
    alert('통신 오류가 발생했습니다.');
  }
}

// 알림 무시
async function dismissGuildAlert() {
  try {
    await fetch('/api/dismiss-baseline-alert', { method: 'POST' });
    document.getElementById('guildAlertBanner').style.display = 'none';
  } catch (e) {
    alert('통신 오류가 발생했습니다.');
  }
}

function renderAvgRankList(rows) {
  if (!rows.length) return '<div class="lb-empty">데이터 없음</div>';
  return `<div class="lb-list">` + rows.map((r, i) => `
    <div class="lb-row rank-${i + 1}" data-name="${escapeAttr(r.name)}">
      <div class="lb-medal">${MEDALS[i] ?? (i + 1)}</div>
      <div class="lb-meta">
        <div class="lb-name">${escapeAttr(r.name)}${weaponMark(r.weapon_tier)}</div>
        <div class="lb-job">${escapeAttr(normalizeJob(r.job))}</div>
      </div>
      <div class="lb-value">평균 ${r.avg_rank}위<span class="lb-value-sub">${r.weeks}주차</span></div>
    </div>
  `).join('') + `</div>`;
}

function renderFineList(rows) {
  if (!rows.length) return '<div class="lb-empty">미참 회원 없음</div>';
  return `<div class="lb-list">` + rows.map((r, i) => `
    <div class="lb-row rank-${i + 1}" data-name="${escapeAttr(r.name)}">
      <div class="lb-medal">${MEDALS[i] ?? (i + 1)}</div>
      <div class="lb-meta">
        <div class="lb-name">${escapeAttr(r.name)}${weaponMark(r.weapon_tier)}</div>
        <div class="lb-job">${escapeAttr(normalizeJob(r.job))}</div>
      </div>
      <div class="lb-value fine">${r.fine_count}회</div>
    </div>
  `).join('') + `</div>`;
}

function renderDeltaList(rows, kind) {
  // kind: 'rise' | 'drop'
  if (!rows.length) return '<div class="lb-empty">데이터 없음</div>';
  const cls = kind === 'rise' ? 'rise' : 'drop';
  return `<div class="lb-list">` + rows.map((r, i) => {
    const sign = r.delta > 0 ? '+' : '';
    return `
    <div class="lb-row rank-${i + 1}" data-name="${escapeAttr(r.name)}">
      <div class="lb-medal">${MEDALS[i] ?? (i + 1)}</div>
      <div class="lb-meta">
        <div class="lb-name">${escapeAttr(r.name)}${weaponMark(r.weapon_tier)}</div>
        <div class="lb-job">${escapeAttr(normalizeJob(r.job))}</div>
      </div>
      <div class="lb-value ${cls}">${sign}${fmt(r.delta)}<span class="lb-value-sub">평균 대비 ${r.avg_delta > 0 ? '+' : ''}${fmt(r.avg_delta ?? 0)}</span></div>
    </div>
    `;
  }).join('') + `</div>`;
}

async function init() {
  // 개요 페이지: 통계 + 차트 + 통계 분석 + 보약 효과 알림
  const [data, history] = await Promise.all([fetchData(), fetch('/api/history').then(r => r.json())]);
  data.all_members = normalizeMembers(data.all_members);
  currentWeek = data.stats.week;

  renderStats(data.stats);
  setStatLabels(data.stats.week);
  renderBriefing(history);
  renderHistoryChart(history);
  renderStatTrendChart(history);
  renderAnalysis(data.all_members);
  renderDistChart(data.all_members);

  // 보약 효과 알림만 받기 위해 leaderboards 호출
  try {
    const res = await fetch('/api/leaderboards');
    if (res.ok) {
      const lb = await res.json();
      renderGuildAlert(lb.guild_alert || null);
    }
  } catch (e) { /* 무시 */ }
}

// 핸들러: 페이지마다 DOM 요소 유무 다름. null-safe 처리.

// 리더보드 행 클릭 → 해당 회원 히스토리 (표의 '히스토리' 버튼과 동일 동작)
document.addEventListener('click', e => {
  const row = e.target.closest('.lb-row[data-name]');
  if (!row) return;
  window.open(
    `/static/member.html?name=${encodeURIComponent(row.dataset.name)}`,
    '_blank',
    'width=1000,height=800,noopener'
  );
});

const _fullTbodyEl = document.getElementById('fullTbody');
if (_fullTbodyEl) _fullTbodyEl.addEventListener('click', e => {
  const btn = e.target.closest('.history-btn');
  if (!btn) return;
  window.open(
    `/static/member.html?name=${encodeURIComponent(btn.dataset.name)}`,
    '_blank',
    'width=1000,height=800,noopener'
  );
});

const _fineTbodyEl = document.getElementById('fineTbody');
if (_fineTbodyEl) _fineTbodyEl.addEventListener('click', e => {
  const leaveBtn = e.target.closest('.leave-btn');
  if (leaveBtn) {
    showLeaveGuildModal(leaveBtn.dataset.name);
    return;
  }
  const btn = e.target.closest('.fine-btn');
  if (!btn) return;
  const name = btn.dataset.name;
  const rank = btn.dataset.rank;
  const fineCount = parseInt(btn.dataset.fineCount);
  const pendingCount = parseInt(btn.dataset.pendingCount) || 0;
  const isFined = btn.dataset.isFined === 'true';

  if (isFined) {
    showFineUndoModal(name, fineCount, 0, currentWeek, true);
  } else {
    showFineConfirmModal(name, rank, fineCount, pendingCount, currentWeek);
  }
});

// 5분마다 자동 갱신
init();
setInterval(init, 5 * 60 * 1000);
</script>
